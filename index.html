<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gupta Family Tree</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --line: #c3c2b7;
    --hairline: rgba(11,11,11,0.10);
    --side-p: #2a78d6;   /* dad's side  (blue)    */
    --side-m: #008300;   /* mom's side  (green)   */
    --side-d: #e87ba4;   /* you & direct (magenta)*/
    --side-s: #eda100;   /* married in  (yellow)  */
    --accent: #2a78d6;
    --shadow: 0 1px 3px rgba(11,11,11,.08), 0 4px 14px rgba(11,11,11,.06);
    --shadow-lg: 0 4px 12px rgba(11,11,11,.14), 0 12px 40px rgba(11,11,11,.16);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --line: #383835;
    --hairline: rgba(255,255,255,0.12);
    --side-p: #3987e5;
    --side-m: #008300;
    --side-d: #d55181;
    --side-s: #c98500;
    --accent: #3987e5;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.5), 0 12px 40px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    display: flex; flex-direction: column;
  }
  /* ---------- toolbar ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--surface);
    border-bottom: 1px solid var(--grid); z-index: 20;
  }
  #titleWrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #treeTitle {
    font-size: 15px; font-weight: 700; border: 1px solid transparent;
    background: transparent; color: var(--ink); padding: 4px 6px;
    border-radius: 6px; width: 200px; min-width: 90px;
  }
  #treeTitle:hover { border-color: var(--grid); }
  #treeTitle:focus { outline: none; border-color: var(--accent); background: var(--page); }
  .tb-group { display: flex; align-items: center; gap: 4px; }
  .tb-sep { width: 1px; height: 22px; background: var(--grid); margin: 0 2px; }
  button {
    font-family: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--grid);
    border-radius: 7px; padding: 6px 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  button:hover { background: var(--page); border-color: var(--line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.icon { padding: 6px 8px; font-size: 13px; }
  button:disabled { opacity: .4; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 6px 9px; font-size: 12px; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  #searchWrap { position: relative; }
  #searchBox {
    font-family: inherit; font-size: 12.5px; padding: 6px 9px 6px 26px;
    border: 1px solid var(--grid); border-radius: 7px; width: 170px;
    background: var(--surface); color: var(--ink);
  }
  #searchBox:focus { outline: none; border-color: var(--accent); }
  #searchWrap::before { content: "🔍"; position: absolute; left: 8px; top: 6px; font-size: 11px; opacity: .6; }
  #searchResults {
    position: absolute; top: 34px; left: 0; width: 240px; max-height: 260px; overflow: auto;
    background: var(--surface); border: 1px solid var(--grid); border-radius: 8px;
    box-shadow: var(--shadow-lg); display: none; z-index: 60;
  }
  #searchResults .sr {
    padding: 7px 10px; cursor: pointer; font-size: 12.5px;
    display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  }
  #searchResults .sr small { color: var(--muted); font-size: 10.5px; }
  #searchResults .sr:hover { background: var(--page); }
  #dirty { font-size: 11px; color: var(--muted); display: none; align-items: center; gap: 5px; }
  #dirty::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--side-s); display: inline-block; }
  /* ---------- canvas ---------- */
  #stage { position: relative; flex: 1; overflow: hidden; }
  #svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #svg.panning { cursor: grabbing; }
  /* ---------- side filter chips ---------- */
  #filterBar {
    position: absolute; top: 10px; left: 12px; z-index: 12;
    display: flex; gap: 5px; flex-wrap: wrap; max-width: 60%;
  }
  #filterBar button {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(4px); box-shadow: var(--shadow);
  }
  #filterBar button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  /* ---------- list view ---------- */
  #listView { position: absolute; inset: 0; overflow: auto; display: none; background: var(--page); z-index: 5; padding: 52px 12px 90px; }
  #listView .lwrap { max-width: 700px; margin: 0 auto; }
  #listView .lnote { font-size: 11.5px; color: var(--muted); margin: 2px 4px 12px; line-height: 1.5; }
  #listView .lsec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 7px; }
  #listView .lrow {
    display: flex; align-items: center; gap: 11px; background: var(--surface);
    border: 1px solid var(--grid); border-left-width: 4px; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 6px; cursor: pointer;
  }
  #listView .lrow:hover { box-shadow: var(--shadow); }
  #listView .lav {
    width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
    background-size: cover; background-position: center;
  }
  #listView .lmain { flex: 1; min-width: 0; }
  #listView .lname { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #listView .lname i { color: var(--muted); font-weight: 400; }
  #listView .lrel { font-size: 11.5px; color: var(--ink-2); }
  #listView .lright { text-align: right; flex: none; }
  #listView .lscore { display: inline-block; font-size: 11px; font-weight: 700; background: var(--page); border: 1px solid var(--grid); padding: 2px 9px; border-radius: 10px; color: var(--ink-2); }
  #listView .lyears { font-size: 10px; color: var(--muted); margin-top: 3px; }
  /* ---------- quiz ---------- */
  #quizView { position: absolute; inset: 0; overflow: auto; display: none; background: var(--page); z-index: 6; padding: 26px 16px 90px; }
  .qcard {
    max-width: 460px; margin: 0 auto; background: var(--surface); border: 1px solid var(--grid);
    border-radius: 16px; padding: 22px; box-shadow: var(--shadow); text-align: center;
  }
  .qprog { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
  .qphoto {
    width: 118px; height: 118px; border-radius: 50%; margin: 12px auto; border: 3px solid var(--grid);
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 700;
  }
  .qq { font-size: 16px; font-weight: 700; margin: 8px 0 16px; line-height: 1.4; }
  .qopts { display: flex; flex-direction: column; gap: 8px; }
  .qopts button { justify-content: center; padding: 11px; font-size: 13.5px; border-radius: 10px; }
  .qopts:not(.qgrid) button.correct { background: #0ca30c; border-color: #0ca30c; color: #fff; font-weight: 700; }
  .qopts:not(.qgrid) button.wrong { background: #d03b3b; border-color: #d03b3b; color: #fff; }
  .qopts.qgrid { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .qopts.qgrid button {
    width: 86px; height: 86px; padding: 0; border-radius: 50%;
    background-size: cover; background-position: center; border-width: 3px;
  }
  .qopts.qgrid button.correct { border-color: #0ca30c; box-shadow: 0 0 0 4px color-mix(in srgb, #0ca30c 35%, transparent); }
  .qopts.qgrid button.wrong { border-color: #d03b3b; box-shadow: 0 0 0 4px color-mix(in srgb, #d03b3b 35%, transparent); }
  .qbig { font-size: 40px; margin: 4px 0 8px; }
  .qnext { margin-top: 14px; }
  .qsub { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  /* ---------- legend ---------- */
  #legend {
    position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 5px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(4px);
    border: 1px solid var(--grid); border-radius: 10px; padding: 9px 12px;
    font-size: 11.5px; color: var(--ink-2); box-shadow: var(--shadow);
  }
  #legend .lg { display: flex; align-items: center; gap: 7px; }
  #legend .chip { width: 11px; height: 11px; border-radius: 3.5px; flex: none; }
  #legend #stats { color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  /* ---------- zoom controls ---------- */
  #zoomCtl {
    position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
  }
  #zoomCtl button { box-shadow: var(--shadow); font-size: 14px; width: 34px; height: 34px; justify-content: center; padding: 0; }
  #zoomCtl button.wide { width: auto; font-size: 11.5px; padding: 0 11px; }
  /* ---------- tip bar ---------- */
  #tipbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(4px);
    border: 1px solid var(--grid); box-shadow: var(--shadow);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--ink-2);
    display: flex; gap: 10px; align-items: center; max-width: min(92%, 640px); z-index: 15;
  }
  #tipbar b { color: var(--ink); }
  #tipbar button { padding: 3px 8px; font-size: 11px; flex: none; }
  /* ---------- side panel ---------- */
  #panel {
    position: absolute; top: 10px; right: 10px; width: 272px; max-height: calc(100% - 20px);
    overflow: auto; background: var(--surface); border: 1px solid var(--grid);
    border-radius: 12px; box-shadow: var(--shadow-lg); display: none; z-index: 30;
  }
  #panel .ph { padding: 14px 14px 10px; display: flex; gap: 11px; align-items: center; }
  #panel .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; overflow: hidden; border: 2px solid var(--grid);
    background-size: cover; background-position: center;
  }
  #panel .pname { font-size: 15px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  #panel .prel { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  #panel .pyears { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #panel .pnotes {
    font-size: 12px; color: var(--ink-2); padding: 0 14px 10px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #panel .pactions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 14px 12px; }
  #panel .pactions button { justify-content: center; font-size: 12px; padding: 7px 6px; }
  #panel .pactions button.span2 { grid-column: span 2; }
  #panel .danger { color: #d03b3b; border-color: color-mix(in srgb, #d03b3b 35%, var(--grid)); }
  #panel .pclose {
    position: absolute; top: 8px; right: 8px; border: none; background: transparent;
    font-size: 15px; padding: 4px 7px; color: var(--muted);
  }
  #panel .sec-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 14px 2px; }
  /* ---------- modal ---------- */
  #modalBg {
    position: fixed; inset: 0; background: rgba(11,11,11,.42); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  #modal {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
    width: 420px; max-width: 100%; max-height: 92vh; overflow: auto;
    border: 1px solid var(--grid);
  }
  #modal .mh { padding: 15px 18px 4px; font-size: 15px; font-weight: 700; }
  #modal .mb { padding: 10px 18px 6px; font-size: 13px; color: var(--ink-2); }
  #modal .mf { padding: 10px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; }
  #modal label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin: 10px 0 4px; }
  #modal input[type=text], #modal input[type=number], #modal select, #modal textarea {
    width: 100%; font-family: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--grid); border-radius: 7px; background: var(--page); color: var(--ink);
  }
  #modal input:focus, #modal select:focus, #modal textarea:focus { outline: none; border-color: var(--accent); }
  #modal textarea { resize: vertical; min-height: 54px; }
  #modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #modal .photoRow { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  #modal .photoPrev {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--grid);
    background-size: cover; background-position: center; display: none; flex: none;
  }
  #modal .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  #modal h4 { font-size: 12px; margin: 14px 0 2px; color: var(--ink); }
  #modal ul { margin: 6px 0 10px 18px; line-height: 1.55; }
  #modal .danger-btn { background: #d03b3b; border-color: #d03b3b; color: #fff; font-weight: 600; }
  /* ---------- toast ---------- */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--page); font-size: 13px; padding: 9px 16px;
    border-radius: 9px; box-shadow: var(--shadow-lg); transition: transform .25s ease; z-index: 200;
    max-width: 90%;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  @media (max-width: 720px) {
    #searchBox { width: 110px; }
    #treeTitle { width: 120px; }
    #panel { width: min(272px, calc(100% - 20px)); }
    #filterBar { top: 64px; max-width: 92%; }
    #listView { padding-top: 96px; }
  }
</style>
</head>
<body>
  <div id="toolbar">
    <div id="titleWrap">
      <input id="treeTitle" title="Tree name — click to edit" spellcheck="false">
    </div>
    <div id="searchWrap">
      <input id="searchBox" placeholder="Find a person…" autocomplete="off">
      <div id="searchResults"></div>
    </div>
    <div class="seg" id="viewSeg" title="How to show the family">
      <button data-view="tree">🌳 Tree</button>
      <button data-view="list">☰ List</button>
      <button data-view="quiz">🎓 Quiz</button>
    </div>
    <div class="tb-sep"></div>
    <div class="seg" id="langSeg" title="Relationship labels">
      <button data-lang="en">English</button>
      <button data-lang="hi">हिंदी</button>
      <button data-lang="both">Both</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button id="btnAddRoot" title="Add an unconnected person">＋ Person</button>
      <button id="btnUndo" class="icon" title="Undo (Ctrl+Z)">↩</button>
      <button id="btnRedo" class="icon" title="Redo (Ctrl+Y)">↪</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button id="btnImport" title="Load a previously exported .json save file">Import</button>
      <button id="btnExport" class="primary" title="Download your tree as a .json save file">⬇ Save file</button>
      <button id="btnPng" title="Download the tree as a PNG image">🖼 PNG</button>
    </div>
    <span id="dirty">unsaved — click “Save file”</span>
    <span style="flex:1"></span>
    <div class="tb-group">
      <button id="btnTheme" class="icon" title="Light / dark">◐</button>
      <button id="btnHelp" class="icon" title="Help">?</button>
    </div>
  </div>

  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="listView"><div class="lwrap"></div></div>
    <div id="quizView"></div>
    <div id="filterBar"></div>
    <div id="tipbar">
      <span><b>Tip:</b> click any card to add a spouse, children or parents — placeholder names are ready for you to edit. Drag empty space to pan, scroll to zoom.</span>
      <button id="tipClose">Got it</button>
    </div>
    <div id="legend"></div>
    <div id="zoomCtl">
      <button id="zOrient" class="wide" title="Flip between top-down and left-right layout">↕ Vertical</button>
      <button id="zDensity" class="wide" title="Small name-chip cards vs full detail cards">▫ Compact</button>
      <button id="zExpandAll" class="wide" title="Show every branch">⊞ Expand all</button>
      <button id="zCollapseAll" class="wide" title="Tidy view — keeps your direct line, tucks side branches into +N pills">⊟ Collapse all</button>
      <button id="zIn" title="Zoom in">＋</button>
      <button id="zOut" title="Zoom out">−</button>
      <button id="zFit" title="Fit to screen">⛶</button>
    </div>
    <div id="panel"></div>
  </div>

  <div id="modalBg"><div id="modal"></div></div>
  <div id="toast"></div>

<script>
"use strict";
/* ============================================================
   Gupta Family Tree — a little app for Vaibhav & his fiancée
   Everything lives in this one file. Data is saved by exporting
   a .json file (⬇ Save file) and re-importing it later.
   ============================================================ */

/* ================= constants, theme, state ================= */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
// layout dimensions — driven by density & orientation settings
let CARD_W = 172, CARD_H = 76, COUPLE_GAP = 20, UNIT_GAP = 30, ROW_H = 178;
let VERT = false, COMPACT = false;
function applyLayoutSettings(){
  COMPACT = state.settings.density === 'compact';
  VERT = state.settings.orient === 'v';
  CARD_W = COMPACT ? 112 : 172;
  CARD_H = COMPACT ? 36 : 76;
  COUPLE_GAP = COMPACT ? 10 : 20;
  UNIT_GAP = VERT ? (COMPACT ? 14 : 20) : (COMPACT ? 16 : 30);
  ROW_H = VERT ? CARD_W + (COMPACT ? 46 : 66) : (COMPACT ? 102 : 178);
}
const THEMES = {
  light: { page:'#f9f9f7', surface:'#fcfcfb', ink:'#0b0b0b', ink2:'#52514e', muted:'#898781',
           grid:'#e1e0d9', line:'#c3c2b7', hair:'rgba(11,11,11,0.10)',
           sides:{ P:'#2a78d6', M:'#008300', D:'#e87ba4', S:'#eda100', N:'#898781' } },
  dark:  { page:'#0d0d0d', surface:'#1a1a19', ink:'#ffffff', ink2:'#c3c2b7', muted:'#898781',
           grid:'#2c2c2a', line:'#383835', hair:'rgba(255,255,255,0.12)',
           sides:{ P:'#3987e5', M:'#008300', D:'#d55181', S:'#c98500', N:'#898781' } }
};
const SIDE_LABEL = { P:"Dad's side", M:"Mom's side", D:"You & your line", S:"Married in", N:"Not linked yet" };

function themeName(){
  const t = state.settings.theme;
  if (t === 'light' || t === 'dark') return t;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function T(){ return THEMES[themeName()]; }

/* ---------------- state ---------------- */
let state = null;
let dirty = false, undoStack = [], redoStack = [];
let selectedId = null;
let view = { x: 0, y: 0, k: 1 };       // pan/zoom transform
let lastLayout = null;                  // {pos:{pid:{x,y}}, unions:{uid:{midX,midY,railY}}, bbox}

function newId(pfx){ state.seq++; return pfx + state.seq; }
function P(){ return state.people; }
function U(){ return state.unions; }

/* ---------------- derived indexes ---------------- */
let IDX = null;
function rebuildIndex(){
  IDX = { parentUnion: {}, unionsOf: {} };
  for (const [uid, u] of Object.entries(U())){
    u.p.forEach(pid => { (IDX.unionsOf[pid] = IDX.unionsOf[pid] || []).push(uid); });
    u.c.forEach(cid => { IDX.parentUnion[cid] = uid; });
  }
  if (!Array.isArray(state.collapsed)) state.collapsed = [];
  state.collapsed = state.collapsed.filter(uid => U()[uid] && U()[uid].c.length);
}

/* ---------------- branch collapsing ---------------- */
// everyone below a set of starting children: the children, their descendants,
// and spouses who married into those branches (kept if they're blood of a visible family)
function descendantsDown(startChildren){
  const set = new Set();
  const down = p => {
    if (set.has(p) || !P()[p]) return;
    set.add(p);
    for (const uid of unionsOf(p)){
      const u = U()[uid];
      u.c.forEach(down);
      u.p.forEach(q => { if (q !== p && !parentUnionOf(q)) down(q); });
    }
  };
  (startChildren || []).forEach(down);
  return set;
}
function hiddenSet(){
  const hidden = new Set();
  for (const uid of state.collapsed){
    const u = U()[uid]; if (!u) continue;
    for (const p of descendantsDown(u.c)) hidden.add(p);
  }
  return hidden;
}
function toggleCollapse(uid){
  if (!U()[uid]) return;
  snapshot();
  const i = state.collapsed.indexOf(uid);
  if (i >= 0){ state.collapsed.splice(i, 1); commit(); toast('Branch expanded'); }
  else { state.collapsed.push(uid); commit(); toast('Branch tucked away — click the +N pill to bring it back'); }
}
function expandAll(){
  if (!state.collapsed.length){ toast('Everything is already expanded'); return; }
  snapshot();
  state.collapsed = [];
  commit(); fitView();
  toast('All branches expanded');
}
// tuck away every branch EXCEPT the direct line to "me":
// ancestors' unions stay open, so you + your spine + their siblings remain visible
function collapseAll(){
  const spine = new Set();
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (me){
    unionsOf(me).forEach(u => spine.add(u));
    const q = [me]; const seen = new Set();
    while (q.length){
      const a = q.pop();
      if (seen.has(a)) continue;
      seen.add(a);
      const pu = parentUnionOf(a);
      if (pu){ spine.add(pu); U()[pu].p.forEach(p => q.push(p)); }
    }
  }
  const target = Object.entries(U()).filter(([uid, u]) => u.c.length && !spine.has(uid)).map(([uid]) => uid);
  const cur = new Set(state.collapsed);
  if (target.length === cur.size && target.every(t => cur.has(t))){ toast('Already as tidy as it gets'); return; }
  snapshot();
  state.collapsed = target;
  commit(); fitView();
  toast(me ? 'Tidied up — your direct line stays; tap +N pills to explore branches' : 'All branches tucked away');
}
function expandToReveal(pid){
  if (!hiddenSet().has(pid)) return false;
  snapshot();
  let guard = 0;
  while (guard++ < 60 && hiddenSet().has(pid)){
    const uid = state.collapsed.find(u => U()[u] && descendantsDown(U()[u].c).has(pid));
    if (!uid) break;
    state.collapsed = state.collapsed.filter(x => x !== uid);
  }
  markDirty();
  return true;
}
function parentUnionOf(pid){ return IDX.parentUnion[pid] || null; }
function unionsOf(pid){ return IDX.unionsOf[pid] || []; }
function parentsOf(pid){ const u = parentUnionOf(pid); return u ? U()[u].p : []; }
function siblingsOf(pid){
  const u = parentUnionOf(pid); if (!u) return [];
  return U()[u].c.filter(c => c !== pid);
}
function spousesOf(pid){
  return unionsOf(pid).flatMap(uid => U()[uid].p.filter(x => x !== pid));
}

function makePerson(name, g, extra){
  const p = Object.assign({ name: name||'', g: g||'', by:'', dy:'', call:'', notes:'', photo:'', adj:'' }, extra||{});
  for (const k of Object.keys(p)) if (k.startsWith('_')) delete p[k];   // form-only fields
  return p;
}

/* ---------------- mutations (with undo) ---------------- */
function snapshot(){
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 80) undoStack.shift();
  redoStack = [];
}
function markDirty(){
  dirty = true;
  document.getElementById('dirty').style.display = 'inline-flex';
}
function commit(){ rebuildIndex(); markDirty(); render(); }

function addSpouse(pid, props, status){
  snapshot();
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  // if pid has a single-parent union (children but no partner), attach there
  const single = unionsOf(pid).map(uid => U()[uid]).find(u => u.p.length === 1);
  if (single && status !== 'e'){ single.p.push(nid); if (status) single.t = status; }
  else { U()[newId('u')] = { p: [pid, nid], c: [], t: status || 'm' }; }
  commit(); return nid;
}
function addChild(pid, props, unionId){
  snapshot();
  let uid = unionId;
  if (!uid){
    const us = unionsOf(pid);
    uid = us[0];
    if (!uid){ uid = newId('u'); U()[uid] = { p: [pid], c: [], t: 'm' }; }
  }
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  U()[uid].c.push(nid);
  commit(); return nid;
}
function addSibling(pid, props){
  snapshot();
  let uid = parentUnionOf(pid);
  if (!uid){ // create placeholder parents
    uid = newId('u');
    const f = newId('p'), m = newId('p');
    P()[f] = makePerson('', 'm'); P()[m] = makePerson('', 'f');
    U()[uid] = { p: [f, m], c: [pid], t: 'm' };
  }
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  U()[uid].c.push(nid);
  commit(); return nid;
}
function addParents(pid){
  snapshot();
  const uid = newId('u');
  const f = newId('p'), m = newId('p');
  P()[f] = makePerson('', 'm'); P()[m] = makePerson('', 'f');
  U()[uid] = { p: [f, m], c: [pid], t: 'm' };
  commit(); return uid;
}
function addRootPerson(props){
  snapshot();
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  commit(); return nid;
}
function updatePerson(pid, props){
  snapshot();
  Object.assign(P()[pid], props);
  commit();
}
function deletePerson(pid){
  snapshot();
  for (const [uid, u] of Object.entries(U())){
    u.p = u.p.filter(x => x !== pid);
    u.c = u.c.filter(x => x !== pid);
  }
  for (const [uid, u] of Object.entries(U())){
    if (u.p.length === 0) delete U()[uid];             // parents gone → children become roots
    else if (u.p.length === 1 && u.c.length === 0) delete U()[uid];
  }
  delete P()[pid];
  if (state.meId === pid) state.meId = null;
  if (selectedId === pid) selectedId = null;
  commit();
}
function moveSibling(pid, dir){
  const uid = parentUnionOf(pid); if (!uid) return;
  const arr = U()[uid].c, i = arr.indexOf(pid), j = i + dir;
  if (j < 0 || j >= arr.length) return;
  snapshot();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  commit();
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  selectedId = P()[selectedId] ? selectedId : null;
  rebuildIndex(); markDirty(); render(); toast('Undone');
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  selectedId = P()[selectedId] ? selectedId : null;
  rebuildIndex(); markDirty(); render(); toast('Redone');
}

/* ---------------- sides (color coding) ---------------- */
function bloodReach(start){
  // blood relatives = ancestors of start + all descendants of those ancestors
  const anc = new Set(); let q = [start];
  while (q.length){
    const a = q.pop();
    if (anc.has(a)) continue;
    anc.add(a);
    parentsOf(a).forEach(p => q.push(p));
  }
  const out = new Set(anc); q = [...anc];
  while (q.length){
    const a = q.pop();
    for (const c of childrenOfAll(a)){
      if (!out.has(c)){ out.add(c); q.push(c); }
    }
  }
  return out;
}
function childrenOfAll(pid){
  return unionsOf(pid).flatMap(uid => U()[uid].c);
}
function descendantsPlusSelf(set){
  const seen = new Set(set); const q = [...set];
  while (q.length){
    const a = q.pop();
    for (const b of childrenOfAll(a)){ if (!seen.has(b)){ seen.add(b); q.push(b); } }
  }
  return seen;
}
function computeSides(){
  const side = {};
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (!me){ for (const pid of Object.keys(P())) side[pid] = 'N'; return side; }
  const par = parentsOf(me);
  const father = par.find(p => P()[p] && P()[p].g === 'm') || par[0] || null;
  const mother = par.find(p => p !== father) || null;
  const direct = descendantsPlusSelf(new Set([me, ...siblingsOf(me)]));
  const pat = father ? bloodReach(father) : new Set();
  const mat = mother ? bloodReach(mother) : new Set();
  for (const pid of Object.keys(P())){
    if (direct.has(pid)) side[pid] = 'D';
    else if (pat.has(pid)) side[pid] = 'P';
    else if (mat.has(pid)) side[pid] = 'M';
    else side[pid] = null;                       // maybe married in — resolve below
  }
  // married-in: anyone unresolved but partnered with a resolved person
  let changed = true;
  while (changed){
    changed = false;
    for (const pid of Object.keys(P())){
      if (side[pid]) continue;
      const sp = spousesOf(pid).find(s => side[s] && side[s] !== 'S');
      if (sp){ side[pid] = 'S'; changed = true; }
    }
  }
  for (const pid of Object.keys(P())) if (!side[pid]) side[pid] = 'N';
  return side;
}

/* ================= family-side filter ================= */
let sideFilter = null;   // null | 'dada' | 'dadi' | 'mat'
function filterAnchors(){
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (!me) return {};
  const par = parentsOf(me);
  const father = par.find(p => P()[p] && P()[p].g === 'm') || par[0] || null;
  const mother = par.find(p => p !== father) || null;
  const gp = father ? parentsOf(father) : [];
  const dada = gp.find(p => P()[p] && P()[p].g === 'm') || gp[0] || null;
  const dadi = gp.find(p => p !== dada) || null;
  return { father, mother, dada, dadi };
}
// bucket = blood relatives of the anchor + everyone married to them
function sideBucket(){
  if (!sideFilter) return null;
  const a = filterAnchors();
  const anchor = sideFilter === 'dada' ? a.dada : sideFilter === 'dadi' ? a.dadi : a.mother;
  if (!anchor) return null;
  const blood = bloodReach(anchor);
  const set = new Set(blood);
  for (const pid of blood) spousesOf(pid).forEach(s => set.add(s));
  return set;
}
function renderFilterBar(){
  const bar = document.getElementById('filterBar');
  const a = filterAnchors();
  const nm = pid => (pid && P()[pid] && (P()[pid].name || P()[pid].call)) || null;
  const chips = [['all', 'All']];
  if (a.dada) chips.push(['dada', (nm(a.dada) || 'Dada ji') + '’s side']);
  if (a.dadi) chips.push(['dadi', (nm(a.dadi) || 'Dadi ji') + '’s side']);
  if (a.mother) chips.push(['mat', 'Maternal side']);
  if (chips.length <= 1){ bar.innerHTML = ''; return; }
  bar.innerHTML = chips.map(([k, label]) =>
    `<button data-f="${k}" class="${(sideFilter || 'all') === k ? 'on' : ''}">${esc(label)}</button>`).join('');
  bar.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.f;
    sideFilter = k === 'all' ? null : k;
    render();
    if (state.settings.view !== 'list') fitView();
  });
}

/* ================= closeness degrees =================
   Degree 0 = "me"'s mother & father; every blood link +2,
   +1 extra when the link goes to a daughter; spouses share
   their partner's score exactly. */
function degreeSources(){
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (!me) return [];
  const pu = parentUnionOf(me);
  const parents = pu ? U()[pu].p.filter(p => P()[p]) : [];
  return parents.length ? parents : [me];
}
// generation of each person relative to "me" (negative = older generations)
function computeGenerations(){
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (!me) return {};
  const adj = {};
  const link = (a, b, d) => { (adj[a] = adj[a] || []).push([b, d]); };
  for (const u of Object.values(U())){
    for (let i = 0; i < u.p.length; i++)
      for (let j = 0; j < u.p.length; j++) if (i !== j) link(u.p[i], u.p[j], 0);
    for (const c of u.c) for (const p of u.p){ link(c, p, -1); link(p, c, 1); }
  }
  const gen = { [me]: 0 };
  const q = [me];
  while (q.length){
    const a = q.shift();
    for (const [b, d] of (adj[a] || [])) if (!(b in gen)){ gen[b] = gen[a] + d; q.push(b); }
  }
  return gen;
}
function genChip(g){
  if (g == null || g === 0) return '';
  return g < 0 ? '↑' + (-g) : '↓' + g;
}
/* Model: a household (couple + their children) is one unit.
   Your parents' household = 0. Hopping to a linked household
   costs +2, plus 1 more when the connecting person is a daughter.
   Within a household: parents & sons = base, daughters = base+1.
   Husband & wife always share one score. */
function computeDegrees(ignoreAdjust){
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (!me) return {};
  // unmarried children rank with their parents; marriage adds +1 for sons, +2 for daughters
  const isMarried = pid => unionsOf(pid).some(uid => {
    const u = U()[uid];
    return u && (u.p.length > 1 ? u.t !== 'e' : u.c.length > 0);
  });
  const mPen = pid => !isMarried(pid) ? 0 : (g_(pid) === 'f' ? 2 : 1);
  const upW = pid => 2 + ((g_(pid) === 'f' && isMarried(pid)) ? 1 : 0);
  const adjOf = pid => {
    if (ignoreAdjust) return 0;
    const v = parseInt(P()[pid] && P()[pid].adj);
    return isNaN(v) ? 0 : v;
  };
  const srcU = parentUnionOf(me);
  const udist = {}, uprev = {};
  const pq = [];
  if (srcU){ udist[srcU] = 0; uprev[srcU] = null; pq.push([0, srcU]); }
  else for (const uid of unionsOf(me)){ udist[uid] = 0; uprev[uid] = null; pq.push([0, uid]); }
  // households are linked through a person who is a child in one and a partner in the other:
  // going DOWN into their own family costs their marriage penalty; going UP costs +2 (+1 via a married daughter)
  const uadj = {};
  for (const pid of Object.keys(P())){
    const cu = parentUnionOf(pid);
    if (!cu) continue;
    for (const pu of unionsOf(pid)){
      (uadj[cu] = uadj[cu] || []).push([pu, mPen(pid), pid]);
      (uadj[pu] = uadj[pu] || []).push([cu, upW(pid), pid]);
    }
  }
  while (pq.length){
    pq.sort((a, b) => a[0] - b[0]);
    const [d, a] = pq.shift();
    if (d > (udist[a] ?? Infinity)) continue;
    for (const [b, w, via] of (uadj[a] || [])){
      const nd = d + w;
      if (nd < (udist[b] ?? Infinity)){ udist[b] = nd; uprev[b] = { from: a, via }; pq.push([nd, b]); }
    }
  }
  // manual adjustments accumulated along each household's chain to home
  const upadj = {};
  const pathAdj = u => {
    if (u in upadj) return upadj[u];
    const pr = uprev[u];
    const v = pr ? pathAdj(pr.from) + adjOf(pr.via) : 0;
    upadj[u] = v;
    return v;
  };
  const gens = computeGenerations();
  const genPen = pid => { const g = gens[pid]; return (g != null && g < -1) ? (-g) - 1 : 0; };
  // person score: as a partner → household base; as a child → base (+1 for daughters)
  const dist = {};
  for (const pid of Object.keys(P())){
    let bestFinal = Infinity, bestBase = Infinity;
    const consider = (base, delta) => {
      const f = base + delta;
      if (f < bestFinal){ bestFinal = f; bestBase = base; }
    };
    const cu = parentUnionOf(pid);
    if (cu && udist[cu] != null)
      consider(udist[cu] + mPen(pid) + genPen(pid), pathAdj(cu) + adjOf(pid));
    for (const pu of unionsOf(pid)){
      if (udist[pu] == null) continue;
      const via = uprev[pu] && uprev[pu].via;
      consider(udist[pu] + genPen(pid), pathAdj(pu) + (via === pid ? 0 : adjOf(pid)));
    }
    if (bestFinal < Infinity){
      let f = bestFinal;
      if (f < bestBase) f = Math.max(f, Math.min(bestBase, 3));   // minus-adjustments never go below 3
      dist[pid] = f;
    }
  }
  if (dist[me] == null) dist[me] = 0;
  // couples share the lower partner's score
  for (const u of Object.values(U())){
    const scores = u.p.map(p => dist[p]).filter(v => v != null);
    if (!scores.length) continue;
    const m = Math.min(...scores);
    u.p.forEach(p => { if (P()[p]) dist[p] = Math.min(dist[p] ?? Infinity, m); });
  }
  return dist;
}

/* ================= kinship (relationship to "me") ================= */
function buildGraph(){
  const adj = {};
  const push = (a, b, move, uid) => { (adj[a] = adj[a] || []).push({ to: b, move, uid }); };
  for (const [uid, u] of Object.entries(U())){
    for (let i = 0; i < u.p.length; i++)
      for (let j = 0; j < u.p.length; j++)
        if (i !== j) push(u.p[i], u.p[j], 'S', uid);
    for (const c of u.c){
      for (const p of u.p){ push(c, p, 'P', uid); push(p, c, 'C', uid); }
    }
  }
  return adj;
}
// single-source shortest paths from me (blood steps cost 1, spouse steps 1.4)
function allPathsFromMe(){
  const me = state.meId;
  if (!me || !P()[me]) return {};
  const adj = buildGraph();
  const dist = { [me]: 0 }, prev = {};
  const pq = [[0, me]];
  while (pq.length){
    pq.sort((a, b) => a[0] - b[0]);
    const [d, a] = pq.shift();
    if (d > (dist[a] ?? Infinity)) continue;
    for (const e of (adj[a] || [])){
      const nd = d + (e.move === 'S' ? 1.4 : 1);
      if (nd < (dist[e.to] ?? Infinity)){
        dist[e.to] = nd; prev[e.to] = { from: a, move: e.move, uid: e.uid };
        pq.push([nd, e.to]);
      }
    }
  }
  const paths = {};
  for (const pid of Object.keys(P())){
    if (pid === me || !(pid in dist)) continue;
    const steps = [];
    let cur = pid;
    while (cur !== me){ const pr = prev[cur]; steps.unshift({ move: pr.move, uid: pr.uid, to: cur }); cur = pr.from; }
    paths[pid] = collapseSiblings(steps);
  }
  return paths;
}
// P then C through the same union = sibling hop (B)
function collapseSiblings(steps){
  const out = [];
  let i = 0;
  while (i < steps.length){
    if (i + 1 < steps.length && steps[i].move === 'P' && steps[i + 1].move === 'C' && steps[i].uid === steps[i + 1].uid){
      out.push({ move: 'B', uid: steps[i].uid, to: steps[i + 1].to });
      i += 2;
    } else { out.push(steps[i]); i++; }
  }
  return out;
}
function g_(pid){ return (P()[pid] && P()[pid].g) || '?'; }
// elder(a,b): true if a older than b, false if younger, null unknown
function elder(aPid, bPid){
  const a = P()[aPid], b = P()[bPid];
  if (!a || !b) return null;
  const ay = parseInt(a.by), byr = parseInt(b.by);
  if (!isNaN(ay) && !isNaN(byr) && ay !== byr) return ay < byr;
  return null;
}
const GP_EN = { 'm': ['Grandpa', 'Great-grandpa', 'Great-great-grandpa'], 'f': ['Grandma', 'Great-grandma', 'Great-great-grandma'] };
function sideWord(tok){ return tok === 'Pm' ? "dad's side" : "mom's side"; }
function chainWordEN(s){
  const g = g_(s.to);
  if (s.move === 'P') return g === 'm' ? 'dad' : g === 'f' ? 'mom' : 'parent';
  if (s.move === 'B') return g === 'm' ? 'brother' : g === 'f' ? 'sister' : 'sibling';
  if (s.move === 'C') return g === 'm' ? 'son' : g === 'f' ? 'daughter' : 'child';
  return g === 'm' ? 'husband' : g === 'f' ? 'wife' : 'partner';
}
function chainEN(steps){
  const words = steps.map(chainWordEN);
  const s = words.join("’s ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function describeRelation(steps, targetPid){
  const me = state.meId;
  const tok = steps.map(s => s.move + g_(s.to));
  const key = tok.join(' ');
  const n = steps.length;
  const lastG = g_(steps[n - 1].to);
  const first = tok[0];
  const en = s => ({ en: s });
  const R = (e, h) => ({ en: e, hi: h });

  const allMove = m => steps.every(s => s.move === m);

  /* -------- direct line: parents / grandparents -------- */
  if (allMove('P')){
    if (n === 1) return R(lastG === 'm' ? 'Dad' : lastG === 'f' ? 'Mom' : 'Parent', lastG === 'm' ? 'Papa' : 'Mummy');
    const side = sideWord(first);
    const isPat = first === 'Pm';
    if (n === 2){
      const e = (lastG === 'f' ? 'Grandma' : 'Grandpa') + ` (${side})`;
      const h = isPat ? (lastG === 'f' ? 'Dadi ji' : 'Dada ji') : (lastG === 'f' ? 'Nani ji' : 'Nana ji');
      return R(e, h);
    }
    const greats = 'Great-'.repeat(n - 2);
    const e = `${greats}${lastG === 'f' ? 'grandma' : 'grandpa'} (${side})`;
    const h = n === 3 ? (isPat ? (lastG === 'f' ? 'Pardadi ji' : 'Pardada ji') : (lastG === 'f' ? 'Parnani ji' : 'Parnana ji')) : null;
    return R(e, h || hiFallback(steps));
  }
  /* -------- direct line: children / grandchildren -------- */
  if (allMove('C')){
    if (n === 1) return R(lastG === 'f' ? 'Daughter' : 'Son', lastG === 'f' ? 'Beti' : 'Beta');
    if (n === 2){
      const viaSon = tok[0] === 'Cm';
      const e = lastG === 'f' ? 'Granddaughter' : 'Grandson';
      const h = viaSon ? (lastG === 'f' ? 'Poti' : 'Pota') : (lastG === 'f' ? 'Natin' : 'Nati');
      return R(e, h);
    }
    return R('Great-'.repeat(n - 2) + (lastG === 'f' ? 'granddaughter' : 'grandson'), hiFallback(steps));
  }
  /* -------- siblings -------- */

    const pp = geo.partners.map(p => pos[p]);
    const dash = u.t === 'e' ? ` stroke-dasharray="5 4"` : '';
    let drop = null;   // where the children-connector starts
    if (pp.length === 2){
      const [a, b] = pp.slice().sort((x, y) => VERT ? x.y - y.y : x.x - y.x);
      const adjacent = VERT
        ? Math.abs(a.x - b.x) < 2 && (b.y - a.y) <= CARD_H + 40
        : Math.abs(a.y - b.y) < 2 && (b.x - a.x) <= CARD_W + COUPLE_GAP + 40;
      if (adjacent && VERT){
        const x = a.x;
        edges += `<line x1="${x}" y1="${a.y + CARD_H/2}" x2="${x}" y2="${b.y - CARD_H/2}" stroke="${t.line}" stroke-width="2"${dash}/>`;
        const my = (a.y + CARD_H/2 + b.y - CARD_H/2) / 2;
        edges += `<circle cx="${x}" cy="${my - 3}" r="3.4" fill="${t.surface}" stroke="${t.line}" stroke-width="1.6"/>`
               + `<circle cx="${x}" cy="${my + 3}" r="3.4" fill="${t.surface}" stroke="${t.line}" stroke-width="1.6"/>`;
        drop = { x, y: my };
      } else if (adjacent){
        const y = a.y;
        edges += `<line x1="${a.x + CARD_W/2}" y1="${y}" x2="${b.x - CARD_W/2}" y2="${y}" stroke="${t.line}" stroke-width="2"${dash}/>`;
        const mx = (a.x + CARD_W/2 + b.x - CARD_W/2) / 2;
        edges += `<circle cx="${mx - 3}" cy="${y}" r="3.4" fill="${t.surface}" stroke="${t.line}" stroke-width="1.6"/>`
               + `<circle cx="${mx + 3}" cy="${y}" r="3.4" fill="${t.surface}" stroke="${t.line}" stroke-width="1.6"/>`;
        drop = { x: mx, y };
      } else if (VERT){
        const x1 = a.x - CARD_W/2, x2 = b.x - CARD_W/2;
        const apex = Math.min(x1, x2) - 30;
        edges += `<path d="M ${x1} ${a.y} C ${apex} ${a.y}, ${apex} ${b.y}, ${x2} ${b.y}" fill="none" stroke="${t.line}" stroke-width="2"${dash}/>`;
        drop = { x: Math.max(...pp.map(p => p.x)) + CARD_W/2, y: (a.y + b.y) / 2 };
      } else {
        const y1 = a.y - CARD_H/2, y2 = b.y - CARD_H/2;
        const apex = Math.min(y1, y2) - 30;
        edges += `<path d="M ${a.x} ${y1} C ${a.x} ${apex}, ${b.x} ${apex}, ${b.x} ${y2}" fill="none" stroke="${t.line}" stroke-width="2"${dash}/>`;
        drop = { x: (a.x + b.x) / 2, y: apex };
      }
    } else if (pp.length === 1){
      drop = VERT ? { x: pp[0].x + CARD_W/2, y: pp[0].y } : { x: pp[0].x, y: pp[0].y + CARD_H/2 };
    }
    // children connectors
    const kids = u.c.filter(c => pos[c]);
    if (kids.length && geo.rail != null && drop){
      if (VERT){
        const railX = geo.rail;
        let d = `M ${drop.x} ${drop.y} L ${railX} ${drop.y} `;
        const kys = kids.map(k => pos[k].y);
        const mny = Math.min(...kys, drop.y), mxy = Math.max(...kys, drop.y);
        d += `M ${railX} ${mny} L ${railX} ${mxy} `;
        for (const k of kids) d += `M ${railX} ${pos[k].y} L ${pos[k].x - CARD_W/2} ${pos[k].y} `;
        edges += `<path d="${d}" fill="none" stroke="${t.line}" stroke-width="1.6" stroke-linecap="round"/>`;
      } else {
        const railY = geo.rail;
        let d = `M ${drop.x} ${drop.y} L ${drop.x} ${railY} `;
        const kxs = kids.map(k => pos[k].x);
        const mnx = Math.min(...kxs, drop.x), mxx = Math.max(...kxs, drop.x);
        d += `M ${mnx} ${railY} L ${mxx} ${railY} `;
        for (const k of kids) d += `M ${pos[k].x} ${railY} L ${pos[k].x} ${pos[k].y - CARD_H/2} `;
        edges += `<path d="${d}" fill="none" stroke="${t.line}" stroke-width="1.6" stroke-linecap="round"/>`;
      }
    }
    // branch collapse control (− to hide) or badge (+N to show)
    if (u.c.length && drop){
      const btnX = VERT ? Math.max(...pp.map(p => p.x)) + CARD_W/2 + 13 : drop.x;
      const btnY = VERT ? drop.y : (pp.length === 2 ? Math.max(...pp.map(p => p.y)) + CARD_H/2 : drop.y) + 13;
      const isClp = state.collapsed.includes(uid);
      if (isClp){
        const n = descendantsDown(u.c).size;
        const label = '+' + n;
        const bw = 20 + String(n).length * 7;
        const sc = t.sides[sides[u.p[0]] || 'N'] || t.muted;
        const stub = VERT
          ? `<line x1="${-bw/2 - 5}" y1="0" x2="${-bw/2 - 1}" y2="0" stroke="${t.line}" stroke-width="1.6"/>`
          : `<line x1="0" y1="-13" x2="0" y2="-9" stroke="${t.line}" stroke-width="1.6"/>`;
        badges += `<g class="clps" data-uid="${uid}" transform="translate(${VERT ? btnX + bw/2 : btnX},${btnY})" style="cursor:pointer">
          <title>Show ${n} hidden family member${n === 1 ? '' : 's'}</title>
          <rect x="${-bw/2 - 8}" y="-16" width="${bw + 16}" height="34" fill="transparent"/>
          ${stub}
          <rect x="${-bw/2}" y="-9" width="${bw}" height="19" rx="9.5" fill="${sc}"/>
          <text x="0" y="4.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${label}</text>
        </g>`;
      } else if (kids.length){
        toggles += `<g class="clps" data-uid="${uid}" transform="translate(${btnX},${btnY})" style="cursor:pointer">
          <title>Hide everyone below this ${pp.length === 2 ? 'couple' : 'person'}</title>
          <circle r="15" fill="transparent"/>
          <circle r="7" fill="${t.surface}" stroke="${t.line}" stroke-width="1.4"/>
          <text x="0" y="3.6" font-size="11.5" fill="${t.ink2}" text-anchor="middle">−</text>
        </g>`;
      }
    }
  }

  /* ---- person cards ---- */
  const langBudget = 26;
  for (const [pid, p] of Object.entries(P())){
    const c = pos[pid]; if (!c) continue;
    const side = sides[pid], sc = t.sides[side] || t.muted;
    const rel = relationEntry(paths, pid);
    const relText = relLabel(rel);
    const isMe = pid === state.meId, isSel = pid === selectedId;
    const stroke = isSel ? t.sides.P : isMe ? sc : t.hair;
    const sw = isSel ? 2.5 : isMe ? 2 : 1;
    const name = displayName(p);
    let inner;
    if (COMPACT){
      const label = name ? truncate(name.trim().split(/\s+/)[0], 11) : null;
      let av;
      if (p.photo){
        defs += `<clipPath id="cp_${pid}"><circle cx="${-CARD_W/2 + 17}" cy="0" r="11"/></clipPath>`;
        av = `<image href="${p.photo}" x="${-CARD_W/2 + 6}" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp_${pid})"/>`;
      } else {
        av = `<circle cx="${-CARD_W/2 + 17}" cy="0" r="11" fill="${sc}" opacity="0.16"/>`
           + `<text x="${-CARD_W/2 + 17}" y="3.5" font-size="9" font-weight="700" fill="${sc}" text-anchor="middle">${esc(initialsOf(p))}</text>`;
      }
      inner = av + (label
        ? `<text x="${-CARD_W/2 + 32}" y="4" font-size="11.5" font-weight="600" fill="${t.ink}">${esc(label)}</text>`
        : `<text x="${-CARD_W/2 + 32}" y="4" font-size="10.5" font-style="italic" fill="${t.muted}">add name</text>`);
    } else {
      const nameSvg = name
        ? `<text x="${-CARD_W/2 + 52}" y="-10" font-size="12.5" font-weight="600" fill="${t.ink}">${esc(truncate(name, 16))}</text>`
        : `<text x="${-CARD_W/2 + 52}" y="-10" font-size="12" font-style="italic" fill="${t.muted}">Add name</text>`;
      const relLines = wrap2(relText, langBudget);
      let relSvg = '';
      if (relLines[0]) relSvg += `<text x="${-CARD_W/2 + 52}" y="5" font-size="10" fill="${t.ink2}">${esc(truncate(relLines[0], langBudget + 2))}</text>`;
      if (relLines[1]) relSvg += `<text x="${-CARD_W/2 + 52}" y="17" font-size="10" fill="${t.ink2}">${esc(relLines[1])}</text>`;
      const yl = yearsLine(p);
      const ySvg = yl ? `<text x="${-CARD_W/2 + 52}" y="${relLines[1] ? 29 : 20}" font-size="9.5" fill="${t.muted}">${esc(yl)}</text>` : '';
      let avatar;
      if (p.photo){
        defs += `<clipPath id="cp_${pid}"><circle cx="${-CARD_W/2 + 28}" cy="0" r="17"/></clipPath>`;
        avatar = `<image href="${p.photo}" x="${-CARD_W/2 + 11}" y="-17" width="34" height="34" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp_${pid})"/>`
               + `<circle cx="${-CARD_W/2 + 28}" cy="0" r="17" fill="none" stroke="${t.grid}" stroke-width="1"/>`;
      } else {
        avatar = `<circle cx="${-CARD_W/2 + 28}" cy="0" r="17" fill="${sc}" opacity="0.16"/>`
               + `<text x="${-CARD_W/2 + 28}" y="4.5" font-size="12.5" font-weight="700" fill="${sc}" text-anchor="middle">${esc(initialsOf(p))}</text>`;
      }
      inner = avatar + nameSvg + relSvg + ySvg;
    }
    nodes += `<g class="card" data-pid="${pid}" transform="translate(${c.x},${c.y})" style="cursor:pointer">
      <title>${esc(name || 'Add name')}${relText ? ' — ' + esc(relText) : ''}</title>
      <rect x="${-CARD_W/2}" y="${-CARD_H/2}" width="${CARD_W}" height="${CARD_H}" rx="${COMPACT ? 8 : 11}" fill="${t.surface}" stroke="${stroke}" stroke-width="${sw}"/>
      <rect x="${-CARD_W/2 + 3}" y="${-CARD_H/2 + 4}" width="${COMPACT ? 3 : 4.5}" height="${CARD_H - 8}" rx="1.8" fill="${sc}"/>
      ${inner}
      ${isMe ? `<text x="${CARD_W/2 - 8}" y="${-CARD_H/2 + (COMPACT ? 11 : 15)}" font-size="${COMPACT ? 8.5 : 10}" text-anchor="end" fill="${sc}" font-weight="700">★</text>` : ''}
    </g>`;
  }

  svg.innerHTML = `<defs>${defs}</defs><g id="vp"><g id="edges">${edges}</g><g id="badges">${badges}</g><g id="nodes">${nodes}</g><g id="toggles">${toggles}</g></g>`;
  if (firstRender){ fitView(); firstRender = false; }
  applyView();
  renderLegend(sides);
  renderPanel();
  syncToolbar();
}

/* ================= who's-who quiz ================= */
let quiz = null;   // { qs:[{pid, type, options[], answerIdx}], i, score, picked }
function quizPool(){
  const degrees = computeDegrees();
  const paths = allPathsFromMe();
  return Object.entries(P())
    .filter(([pid, p]) => p.name && pid !== state.meId)
    .map(([pid, p]) => {
      const entry = relationEntry(paths, pid);
      const rel = (entry.auto ? relLabel(entry.auto) : relLabel(entry)) || '';   // always the real rishta, never the pet name
      return { pid, p, deg: degrees[pid] ?? 99, rel, gen: 0 };
    })
    .filter(e => e.rel && !e.rel.startsWith('Not linked'))
    .sort((a, b) => a.deg - b.deg)
    .slice(0, 60);
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// closer people are asked more often, but everyone in the pool can appear
function weightedSample(arr, n){
  const keyed = arr.map(e => ({ e, k: Math.pow(Math.random(), (e.deg + 2) / 4) }));
  keyed.sort((a, b) => b.k - a.k);
  return keyed.slice(0, n).map(x => x.e);
}
let askedRecently = [];   // avoid repeating people across rounds
function startQuiz(){
  const pool = quizPool();
  if (pool.length < 8){ toast('Add a few more named people first'); return; }
  const gens = computeGenerations();
  pool.forEach(e => e.gen = gens[e.pid] ?? 0);
  let candidates = pool.filter(e => !askedRecently.includes(e.pid));
  if (candidates.length < 10){ askedRecently = []; candidates = pool.slice(); }
  const picked = weightedSample(candidates, Math.min(10, candidates.length));
  picked.forEach(e => askedRecently.push(e.pid));
  if (askedRecently.length > 45) askedRecently = askedRecently.slice(-45);

  const relCount = {};
  pool.forEach(e => relCount[e.rel] = (relCount[e.rel] || 0) + 1);
  const photoPeeps = g => Object.entries(P())
    .filter(([pid, p]) => p.photo && p.name && p.g === g && pid !== state.meId);

  const qs = picked.map(e => {
    const sameG = pool.filter(x => x.pid !== e.pid && x.p.g === e.p.g);
    const types = ['name2rel'];
    if (relCount[e.rel] === 1) types.push('rel2name');            // only when exactly one person has that rishta
    if (e.p.photo) types.push('photo', 'photo');
    if (e.p.photo && photoPeeps(e.p.g).length >= 4) types.push('whichphoto');
    const type = types[Math.floor(Math.random() * types.length)];

    if (type === 'whichphoto'){
      const others = shuffle(photoPeeps(e.p.g).filter(([pid]) => pid !== e.pid)).slice(0, 3);
      const options = shuffle([{ pid: e.pid, photo: e.p.photo }, ...others.map(([pid, p]) => ({ pid, photo: p.photo }))]);
      return { e, type, options, answerKey: e.pid };
    }
    if (type === 'name2rel'){
      // decoy rishtas from SAME-GENDER people, preferring nearby generations
      const cands = sameG
        .filter(x => x.rel && x.rel !== e.rel)
        .sort((a, b) => Math.abs(a.gen - e.gen) - Math.abs(b.gen - e.gen));
      const uniq = [];
      for (const x of shuffle(cands.slice(0, 10))){ if (!uniq.includes(x.rel)) uniq.push(x.rel); if (uniq.length === 3) break; }
      for (const x of cands){ if (uniq.length === 3) break; if (!uniq.includes(x.rel)) uniq.push(x.rel); }
      return { e, type, options: shuffle([e.rel, ...uniq]), answerKey: e.rel };
    }
    // photo / rel2name → name options, strictly gender-matched (relaxed only if needed)
    const namePool = sameG
      .sort((a, b) => Math.abs(a.deg - e.deg) - Math.abs(b.deg - e.deg))
      .map(x => x.p.name)
      .filter((v, i, a) => v && v !== e.p.name && a.indexOf(v) === i);
    let decoys = shuffle(namePool.slice(0, 12)).slice(0, 3);
    if (decoys.length < 3){
      const extra = pool.map(x => x.p.name).filter((v, i, a) => v && v !== e.p.name && !decoys.includes(v) && a.indexOf(v) === i);
      decoys = decoys.concat(shuffle(extra).slice(0, 3 - decoys.length));
    }
    return { e, type, options: shuffle([e.p.name, ...decoys]), answerKey: e.p.name };
  });

  // sprinkle in two "who's closer" questions
  for (let k = 0; k < 2 && qs.length > 3; k++){
    const i = Math.floor(Math.random() * qs.length);
    const a = pool[Math.floor(Math.random() * Math.min(pool.length, 25))];
    const b = shuffle(pool).find(x => x.pid !== a.pid && Math.abs(x.deg - a.deg) >= 2);
    if (a && b) qs[i] = { type: 'closer', a, b, options: shuffle([a, b]), answerKey: (a.deg <= b.deg ? a : b).pid };
  }
  quiz = { qs, i: 0, score: 0, picked: null };
  renderQuizView();
}

    el.innerHTML = `<div class="qcard">
      <div class="qbig">🎓</div>

      <div class="qsub">10 quick questions from the ${esc(meName)}-side inner circle — guess names and rishtas, learn as you go. No pressure, no saving, just practice 😄</div>

  const sides = computeSides();
  let prompt, photoHtml = '', grid = false;
  // normalize options → { key, label?, photo? }
  let optObjs;
  if (q.type === 'closer'){

    }
  }
  const isRight = answered && optObjs[quiz.picked] && optObjs[quiz.picked].key === q.answerKey;
  let feedback = '';
  if (answered){
    if (q.type === 'closer'){
      const w = q.options.find(o => o.pid === q.answerKey), l = q.options.find(o => o.pid !== q.answerKey);
      feedback = `${isRight ? '✅ Sahi jawab!' : '❌ Nope —'} <b>${esc(w.p.name)}</b> is degree ${w.deg}, ${esc(l.p.name)} is ${l.deg}`;
    } else if (q.type === 'whichphoto'){
      feedback = isRight ? '✅ Sahi jawab!' : `❌ The highlighted one is <b>${esc(q.e.p.name)}</b>`;
      if (q.e.p.call) feedback += ` — ${q.e.p.g === 'f' ? 'she’s called' : 'he’s called'} “${esc(q.e.p.call)}”`;
    } else {
      feedback = isRight ? '✅ Sahi jawab!' : `❌ It’s <b>${esc(String(q.answerKey))}</b>`;
      if (q.e.p.call) feedback += ` — you call ${q.e.p.g === 'f' ? 'her' : 'him'} “${esc(q.e.p.call)}”`;
    }
  }
  el.innerHTML = `<div class="qcard">
    <div class="qprog">Question ${quiz.i + 1} of ${quiz.qs.length} · Score ${quiz.score}</div>
    ${photoHtml}
    <div class="qq">${prompt}</div>
    <div class="qopts${grid ? ' qgrid' : ''}">${optObjs.map((o, i) => {
      let cls = '';
      if (answered){
        if (o.key === q.answerKey) cls = 'correct';
        else if (i === quiz.picked) cls = 'wrong';
      }
      const style = o.photo ? ` style="background-image:url('${o.photo}')"` : '';
      return `<button class="${cls}" data-qi="${i}" ${answered ? 'disabled' : ''}${style}>${o.label ? esc(o.label) : ''}</button>`;
    }).join('')}</div>
    ${answered ? `<div class="qnext"><div class="qsub" style="margin-bottom:8px">${feedback}</div><button class="primary" id="qNext">${quiz.i + 1 === quiz.qs.length ? 'See result' : 'Next →'}</button></div>` : ''}
  </div>`;
  if (!answered){
    el.querySelectorAll('[data-qi]').forEach(b => b.onclick = () => {
      quiz.picked = parseInt(b.dataset.qi);
      if (optObjs[quiz.picked].key === q.answerKey) quiz.score++;
      renderQuizView();
    });
  } else {
    document.getElementById('qNext').onclick = () => { quiz.i++; quiz.picked = null; renderQuizView(); };
  }
}

/* ================= cheat-sheet export ================= */
async function exportCheatSheet(){
  const t = T();
  const degrees = computeDegrees();
  const paths = allPathsFromMe();
  const rows = Object.entries(P())
    .filter(([pid, p]) => p.name && pid !== state.meId)
    .map(([pid, p]) => {
      const entry = relationEntry(paths, pid);
      const rel = (entry.auto ? relLabel(entry.auto) : relLabel(entry)) || '';   // show the real rishta even when a nickname exists
      return { pid, p, deg: degrees[pid] ?? 99, rel };
    })
    .filter(e => e.rel && !e.rel.startsWith('Not linked'))
    .sort((a, b) => a.deg - b.deg || (a.p.name).localeCompare(b.p.name))
    .slice(0, 25);
  const W = 720, headH = 84, rowH = 58, pad = 22;
  const H = headH + rows.length * rowH + 34;
  let defs = '', body = '';
  rows.forEach((e, i) => {
    const y = headH + i * rowH;
    const sides = computeSides();
    const sc = t.sides[sides[e.pid]] || t.muted;
    if (e.p.photo){
      defs += `<clipPath id="cs${i}"><circle cx="${pad + 44}" cy="${y + rowH/2}" r="19"/></clipPath>`;
      body += `<image href="${e.p.photo}" x="${pad + 25}" y="${y + rowH/2 - 19}" width="38" height="38" preserveAspectRatio="xMidYMid slice" clip-path="url(#cs${i})"/>`;
    } else {
      body += `<circle cx="${pad + 44}" cy="${y + rowH/2}" r="19" fill="${sc}" opacity="0.16"/>
        <text x="${pad + 44}" y="${y + rowH/2 + 4.5}" font-size="13" font-weight="700" fill="${sc}" text-anchor="middle">${esc(initialsOf(e.p))}</text>`;
    }
    body += `<rect x="${pad}" y="${y + rowH/2 - 8}" width="3" height="16" rx="1.5" fill="${sc}"/>
      <text x="${pad + 74}" y="${y + rowH/2 - 3}" font-size="14" font-weight="700" fill="${t.ink}">${esc(truncate(e.p.name, 26))}${e.p.call ? ` <tspan font-weight="400" font-style="italic" fill="${t.ink2}">“${esc(e.p.call)}”</tspan>` : ''}</text>
      <text x="${pad + 74}" y="${y + rowH/2 + 15}" font-size="11.5" fill="${t.ink2}">${esc(truncate(e.rel, 52))}</text>
      <text x="${W - pad - 8}" y="${y + rowH/2 + 5}" font-size="13" font-weight="700" fill="${t.muted}" text-anchor="end">${e.deg}</text>
      <line x1="${pad}" y1="${y + rowH}" x2="${W - pad}" y2="${y + rowH}" stroke="${t.grid}" stroke-width="1"/>`;
  });
  const fianP = Object.values(U()).filter(u => u.t === 'e' && u.p.includes(state.meId)).map(u => u.p.find(x => x !== state.meId)).map(x => P()[x])[0];
  const subtitle = `top ${rows.length} people to know · ranked by closeness${fianP && fianP.name ? ` · made for ${fianP.name} 💍` : ''}`;
  const doc = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <defs>${defs}</defs>
    <rect width="${W}" height="${H}" fill="${t.page}"/>
    <text x="${pad}" y="38" font-size="22" font-weight="800" fill="${t.ink}">${esc(state.title)} — Who’s Who</text>
    <text x="${pad}" y="60" font-size="12" fill="${t.muted}">${esc(subtitle)}</text>
    ${body}
    <text x="${pad}" y="${H - 12}" font-size="10" fill="${t.muted}">number = closeness degree (0 = ${esc((P()[state.meId] || {}).name || 'home')}’s own home) · lower is closer</text>
  </svg>`;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([doc], { type: 'image/svg+xml;charset=utf-8' }));
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = W * 2; cv.height = H * 2;
    const ctx = cv.getContext('2d');
    ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    cv.toBlob(async bl => {
      if (!bl) return;
      if (IS_IOS){
        try {
          const f = new File([bl], 'family-cheat-sheet.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [f] })){ await navigator.share({ files: [f] }); toast('Cheat-sheet ready 💌'); return; }
        } catch (e){ if (e && e.name === 'AbortError') return; }
        openImageModal(cv.toDataURL('image/png'));
        return;
      }
      const how = await shareOrDownload('family-cheat-sheet.png', bl, 'image/png');
      if (how !== 'cancelled') toast('Cheat-sheet saved — perfect pre-function revision 😄');
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Cheat-sheet export failed — try again'); };
  img.src = url;
}

/* ---- pan & zoom ---- */
function applyView(){
  const vp = document.getElementById('vp');
  if (vp) vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}
function fitView(){
  if (!lastLayout) return;
  const r = svg.getBoundingClientRect();
  const b = lastLayout.bbox;
  const k = Math.min(r.width / b.w, r.height / b.h, 1.15);
  view.k = Math.max(k, 0.05);
  view.x = (r.width - b.w * view.k) / 2 - b.x * view.k;
  view.y = (r.height - b.h * view.k) / 2 - b.y * view.k;
  applyView();
}
function zoomAt(cx, cy, f){
  const nk = Math.min(2.5, Math.max(0.05, view.k * f));
  const real = f === 0 ? 1 : nk / view.k;
  view.x = cx - (cx - view.x) * real;
  view.y = cy - (cy - view.y) * real;
  view.k = nk;
  applyView();
}
function centerOn(pid){
  if (!lastLayout || !lastLayout.pos[pid]) return;
  const r = svg.getBoundingClientRect();
  const p = lastLayout.pos[pid];
  view.k = Math.max(view.k, 0.8);
  view.x = r.width / 2 - p.x * view.k;
  view.y = r.height / 2 - p.y * view.k;
  applyView();
}

/* ================= selection panel ================= */
function renderPanel(){
  const panel = document.getElementById('panel');
  const pid = selectedId;
  if (!pid || !P()[pid]){ panel.style.display = 'none'; return; }
  const p = P()[pid];
  const t = T();
  const sides = computeSides();
  const sc = t.sides[sides[pid]] || t.muted;
  const paths = allPathsFromMe();
  const rel = relationEntry(paths, pid);
  const relBits = [];
  if (rel.you) relBits.push('⭐ This is you');
  else {
    if (p.call) relBits.push(`“${esc(p.call)}”`);
    const auto = p.call ? rel.auto : rel;
    if (auto && auto.en) relBits.push(esc(auto.en));
    if (auto && auto.hi && auto.hi !== auto.en) relBits.push(esc(auto.hi));
  }
  const degAll = computeDegrees();
  const degBase = computeDegrees(true);
  const genAll = computeGenerations();
  if (degAll[pid] != null){
    const gc = genChip(genAll[pid]);
    const adjNote = degAll[pid] !== degBase[pid] ? ` (adjusted, was ${degBase[pid]})` : '';
    relBits.push(`<span style="color:var(--muted)">Degree ${degAll[pid]}${adjNote}${gc ? ' · ' + gc + ' gen' : ''}</span>`);
  }
  const hasParents = !!parentUnionOf(pid);
  const sibs = siblingsOf(pid);
  const kidUnions = unionsOf(pid).filter(uid => U()[uid].c.length);
  const anyOpen = kidUnions.some(uid => !state.collapsed.includes(uid));
  const branchBtn = kidUnions.length
    ? `<button data-act="branch" class="span2">${anyOpen ? '🙈 Hide family below' : '👁 Show family below'}</button>` : '';
  const avatarStyle = p.photo
    ? `background-image:url('${p.photo}')`
    : `background:color-mix(in srgb, ${sc} 16%, transparent); color:${sc}`;
  panel.innerHTML = `
    <button class="pclose" title="Close">✕</button>
    <div class="ph">
      <div class="avatar" style="${avatarStyle}">${p.photo ? '' : esc(initialsOf(p))}</div>
      <div>
        <div class="pname">${p.name ? esc(p.name) : '<i style="color:var(--muted)">No name yet</i>'}</div>
        <div class="prel">${relBits.join('<br>') || '<i>Not connected to you yet</i>'}</div>
        ${yearsLine(p) ? `<div class="pyears">${esc(yearsLine(p))}</div>` : ''}
      </div>
    </div>
    ${p.notes ? `<div class="pnotes">${esc(p.notes)}</div>` : ''}
    <div class="sec-label">Add family around ${p.name ? esc(p.name.split(' ')[0]) : 'them'}</div>
    <div class="pactions">
      <button data-act="spouse">💑 Spouse</button>
      <button data-act="child">👶 Child</button>
      <button data-act="sibling">🧍 Sibling</button>
      <button data-act="parents" ${hasParents ? 'disabled title="Already has parents on the tree"' : ''}>👴 Parents</button>
      ${sibs.length ? `<button data-act="left" title="Move left among siblings">◀ Move</button><button data-act="right" title="Move right among siblings">Move ▶</button>` : ''}
      ${branchBtn}
      ${state.settings.view === 'list' ? '<button data-act="locate" class="span2">🌳 Show on tree</button>' : ''}
      <button data-act="edit" class="span2">✏️ Edit details</button>
      ${pid !== state.meId ? `<button data-act="setme">⭐ Set as “Me”</button>` : '<span></span>'}
      <button data-act="delete" class="danger">🗑 Remove</button>
    </div>`;
  panel.style.display = 'block';
  panel.querySelector('.pclose').onclick = () => { selectedId = null; render(); };
  panel.querySelectorAll('[data-act]').forEach(b => b.onclick = () => panelAction(b.dataset.act, pid));
}
function panelAction(act, pid){
  const p = P()[pid];
  const who = p.name || 'this person';
  if (act === 'spouse') openPersonModal(`Add ${who}’s spouse`, { g: p.g === 'm' ? 'f' : p.g === 'f' ? 'm' : '' }, true, vals => {
    const nid = addSpouse(pid, vals, vals._status);
    selectedId = nid; render();
  });
  else if (act === 'child'){
    const us = unionsOf(pid);
    const partnerChoice = us.length > 1 ? us : null;
    openPersonModal(`Add ${who}’s child`, {}, false, vals => {
      const nid = addChild(pid, vals, vals._union || undefined);
      selectedId = nid; render();
    }, partnerChoice, pid);
  }
  else if (act === 'sibling') openPersonModal(`Add ${who}’s sibling`, { g: '' }, false, vals => {
    const nid = addSibling(pid, vals);
    selectedId = nid; render();
  });
  else if (act === 'parents'){ addParents(pid); toast('Parents added — click their cards to name them'); }
  else if (act === 'branch'){
    const kidUnions = unionsOf(pid).filter(uid => U()[uid].c.length);
    if (!kidUnions.length) return;
    const anyOpen = kidUnions.some(uid => !state.collapsed.includes(uid));
    snapshot();
    if (anyOpen){
      for (const uid of kidUnions) if (!state.collapsed.includes(uid)) state.collapsed.push(uid);
    } else {
      state.collapsed = state.collapsed.filter(uid => !kidUnions.includes(uid));
    }
    commit();
    toast(anyOpen ? 'Family below tucked away' : 'Family below is back');
  }
  else if (act === 'locate'){
    state.settings.view = 'tree';
    listFilter = ''; searchBox.value = '';
    const bk = sideBucket();
    if (bk && !bk.has(pid)) sideFilter = null;
    expandToReveal(pid);
    render();
    centerOn(pid);
  }
  else if (act === 'left') moveSibling(pid, -1);
  else if (act === 'right') moveSibling(pid, +1);
  else if (act === 'edit') openEditModal(pid);
  else if (act === 'setme'){ snapshot(); state.meId = pid; commit(); toast('Relationships now shown relative to ' + (p.name || 'them')); }
  else if (act === 'delete') openDeleteModal(pid);
}

/* ================= pointer: pan, zoom, click ================= */
const ptrs = new Map();
let panBase = null, pinchBase = null, movedFar = false, downCard = null, downClps = null;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  movedFar = false;
  downCard = e.target.closest ? (e.target.closest('.card')?.dataset.pid ?? null) : null;
  downClps = e.target.closest ? (e.target.closest('.clps')?.dataset.uid ?? null) : null;
  if (ptrs.size === 1) panBase = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
  if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    pinchBase = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k,
                  cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, vx: view.x, vy: view.y };
    panBase = null;
  }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinchBase){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const f = d / pinchBase.d;
    const nk = Math.min(2.5, Math.max(0.05, pinchBase.k * f));
    const r = svg.getBoundingClientRect();
    const cx = pinchBase.cx - r.left, cy = pinchBase.cy - r.top;
    view.x = cx - (cx - pinchBase.vx) * (nk / pinchBase.k);
    view.y = cy - (cy - pinchBase.vy) * (nk / pinchBase.k);
    view.k = nk;
    applyView(); movedFar = true;
    return;
  }
  if (panBase){
    const dx = e.clientX - panBase.sx, dy = e.clientY - panBase.sy;
    if (Math.abs(dx) + Math.abs(dy) > 5){ movedFar = true; svg.classList.add('panning'); }
    if (movedFar){
      view.x = panBase.vx + dx; view.y = panBase.vy + dy;
      applyView();
    }
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchBase = null;
  if (ptrs.size === 0){
    svg.classList.remove('panning');
    if (!movedFar){
      if (downClps){ toggleCollapse(downClps); }
      else if (downCard){ selectedId = downCard; render(); }
      else if (selectedId != null){ selectedId = null; render(); }
    }
    panBase = null; downCard = null; downClps = null;
  }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0014));
}, { passive: false });
svg.addEventListener('dblclick', e => {
  const c = e.target.closest ? e.target.closest('.card') : null;
  if (c){ selectedId = c.dataset.pid; render(); openEditModal(c.dataset.pid); }
});

/* ================= save / load / png ================= */
function download(filename, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
// on phones, hand the file to the share sheet (WhatsApp etc.); on desktop, download
async function shareOrDownload(filename, blob, mime){
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (isMobile && navigator.canShare){
    try {
      const f = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [f] })){
        await navigator.share({ files: [f], title: filename });
        return 'shared';
      }
    } catch (e){ if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  download(filename, blob);
  return 'downloaded';
}
function slug(){ return (state.title || 'family-tree').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'family-tree'; }
async function exportJSON(){
  const data = JSON.stringify(Object.assign({}, state, { savedAt: new Date().toISOString() }), null, 1);
  if (IS_IOS){
    // iPhone/iPad: downloads don't work in the WhatsApp/Files preview.
    // Try the native share sheet (works in Safari); otherwise copy-as-text.
    try {
      const f = new File([data], slug() + '.json', { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })){
        await navigator.share({ files: [f], title: slug() + '.json' });
        dirty = false; syncToolbar();
        toast('Save file ready — WhatsApp it back so the tree stays in sync 💌');
        return;
      }
    } catch (e){ if (e && e.name === 'AbortError'){ toast('Share cancelled — changes still unsaved'); return; } }
    openCopySaveModal(data);
    return;
  }
  const how = await shareOrDownload(slug() + '.json', new Blob([data], { type: 'application/json' }), 'application/json');
  if (how === 'cancelled'){ toast('Share cancelled — your changes are still unsaved'); return; }
  dirty = false; syncToolbar();
  toast(how === 'shared'
    ? 'Save file ready — WhatsApp it back so the tree stays in sync 💌'
    : 'Saved! Keep this .json file — Import it next time to continue.');
}
function normalizeData(data){
  // fill any missing fields defensively; drop form-only junk
  for (const p of Object.values(data.people)){
    for (const k of ['name','g','by','dy','call','notes','photo','adj']) if (p[k] == null) p[k] = '';
    for (const k of Object.keys(p)) if (k.startsWith('_')) delete p[k];
  }
  for (const u of Object.values(data.unions)){ u.p = u.p || []; u.c = u.c || []; u.t = u.t || 'm'; }
  data.settings = Object.assign({ lang: 'en', theme: 'auto', view: 'tree', orient: 'h', density: 'full' }, data.settings);
  data.seq = data.seq || 1000;
  data.title = data.title || 'Family Tree';
  if (!Array.isArray(data.collapsed)) data.collapsed = [];
  return data;
}
function importJSONText(txt){
  let data;
  try { data = JSON.parse(txt); } catch (e){ toast('That file isn’t valid JSON'); return; }
  if (!data || typeof data.people !== 'object' || typeof data.unions !== 'object'){ toast('That doesn’t look like a family-tree save file'); return; }
  snapshot();
  state = normalizeData(data);
  selectedId = null; firstRender = true;
  rebuildIndex(); render();
  dirty = false; syncToolbar();
  toast('Tree loaded ✓');
}

document.getElementById('btnPng').onclick = () => {
  if (!lastLayout) return;
  const t = T();
  const b = lastLayout.bbox;
  const pad = 30, headH = 56;
  const w = Math.ceil(b.w + pad * 2), h = Math.ceil(b.h + pad * 2 + headH);
  const vpClone = svg.querySelector('#vp').cloneNode(true);
  const tg = vpClone.querySelector('#toggles'); if (tg) tg.remove();   // no − dots on the image
  const inner = vpClone.innerHTML;
  const stamp = new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
  const hiddenNote = lastShown.shown < lastShown.total
    ? `<text x="${pad}" y="${pad + 26}" font-size="11" fill="${t.muted}">showing ${lastShown.shown} of ${lastShown.total} — some branches are collapsed (+N) or filtered</text>` : '';
  const doc = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect width="${w}" height="${h}" fill="${t.page}"/>
    <text x="${pad}" y="${pad + 8}" font-size="20" font-weight="700" fill="${t.ink}">${esc(state.title)}</text>
    <text x="${w - pad}" y="${pad + 8}" font-size="11" fill="${t.muted}" text-anchor="end">${stamp}</text>
    ${hiddenNote}
    <g transform="translate(${pad - b.x}, ${pad + headH - b.y})">${inner}</g>
  </svg>`;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([doc], { type: 'image/svg+xml;charset=utf-8' }));
  img.onload = () => {
    const scale = Math.min(2, 8000 / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    cv.toBlob(async bl => {
      if (!bl) return;
      if (IS_IOS){
        try {
          const f = new File([bl], slug() + '.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [f] })){
            await navigator.share({ files: [f], title: slug() + '.png' });
            toast('Tree image ready to share 💌');
            return;
          }
        } catch (e){ if (e && e.name === 'AbortError') return; }
        openImageModal(cv.toDataURL('image/png'));   // long-press to save/copy
        return;
      }
      const how = await shareOrDownload(slug() + '.png', bl, 'image/png');
      if (how !== 'cancelled') toast(how === 'shared' ? 'Tree image ready to share 💌' : 'PNG downloaded — perfect for WhatsApp 😉');
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('PNG export failed — try again'); };
  img.src = url;
};
