<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gupta Family Tree</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --line: #c3c2b7;
    --hairline: rgba(11,11,11,0.10);
    --side-p: #2a78d6;   /* dad's side  (blue)    */
    --side-m: #008300;   /* mom's side  (green)   */
    --side-d: #e87ba4;   /* you & direct (magenta)*/
    --side-s: #eda100;   /* married in  (yellow)  */
    --accent: #2a78d6;
    --shadow: 0 1px 3px rgba(11,11,11,.08), 0 4px 14px rgba(11,11,11,.06);
    --shadow-lg: 0 4px 12px rgba(11,11,11,.14), 0 12px 40px rgba(11,11,11,.16);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --line: #383835;
    --hairline: rgba(255,255,255,0.12);
    --side-p: #3987e5;
    --side-m: #008300;
    --side-d: #d55181;
    --side-s: #c98500;
    --accent: #3987e5;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.5), 0 12px 40px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    display: flex; flex-direction: column;
  }
  /* ---------- toolbar ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--surface);
    border-bottom: 1px solid var(--grid); z-index: 20;
  }
  #titleWrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #treeTitle {
    font-size: 15px; font-weight: 700; border: 1px solid transparent;
    background: transparent; color: var(--ink); padding: 4px 6px;
    border-radius: 6px; width: 200px; min-width: 90px;
  }
  #treeTitle:hover { border-color: var(--grid); }
  #treeTitle:focus { outline: none; border-color: var(--accent); background: var(--page); }
  .tb-group { display: flex; align-items: center; gap: 4px; }
  .tb-sep { width: 1px; height: 22px; background: var(--grid); margin: 0 2px; }
  button {
    font-family: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--grid);
    border-radius: 7px; padding: 6px 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  button:hover { background: var(--page); border-color: var(--line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.icon { padding: 6px 8px; font-size: 13px; }
  button:disabled { opacity: .4; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 6px 9px; font-size: 12px; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  #searchWrap { position: relative; }
  #searchBox {
    font-family: inherit; font-size: 12.5px; padding: 6px 9px 6px 26px;
    border: 1px solid var(--grid); border-radius: 7px; width: 170px;
    background: var(--surface); color: var(--ink);
  }
  #searchBox:focus { outline: none; border-color: var(--accent); }
  #searchWrap::before { content: "🔍"; position: absolute; left: 8px; top: 6px; font-size: 11px; opacity: .6; }
  #searchResults {
    position: absolute; top: 34px; left: 0; width: 240px; max-height: 260px; overflow: auto;
    background: var(--surface); border: 1px solid var(--grid); border-radius: 8px;
    box-shadow: var(--shadow-lg); display: none; z-index: 60;
  }
  #searchResults .sr {
    padding: 7px 10px; cursor: pointer; font-size: 12.5px;
    display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  }
  #searchResults .sr small { color: var(--muted); font-size: 10.5px; }
  #searchResults .sr:hover { background: var(--page); }
  #dirty { font-size: 11px; color: var(--muted); display: none; align-items: center; gap: 5px; }
  #dirty::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--side-s); display: inline-block; }
  /* ---------- canvas ---------- */
  #stage { position: relative; flex: 1; overflow: hidden; }
  #svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #svg.panning { cursor: grabbing; }
  /* ---------- quiz ---------- */
  #quizView { position: absolute; inset: 0; overflow: auto; display: none; background: var(--page); z-index: 6; padding: 26px 16px 90px; }
  .qcard {
    max-width: 460px; margin: 0 auto; background: var(--surface); border: 1px solid var(--grid);
    border-radius: 16px; padding: 22px; box-shadow: var(--shadow); text-align: center;
  }
  .qprog { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
  .qphoto {
    width: 118px; height: 118px; border-radius: 50%; margin: 12px auto; border: 3px solid var(--grid);
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 700;
  }
  .qq { font-size: 16px; font-weight: 700; margin: 8px 0 16px; line-height: 1.4; }
  .qopts { display: flex; flex-direction: column; gap: 8px; }
  .qopts button { justify-content: center; padding: 11px; font-size: 13.5px; border-radius: 10px; }
  .qopts:not(.qgrid) button.correct { background: #0ca30c; border-color: #0ca30c; color: #fff; font-weight: 700; }
  .qopts:not(.qgrid) button.wrong { background: #d03b3b; border-color: #d03b3b; color: #fff; }
  .qopts.qgrid { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .qopts.qgrid button {
    width: 86px; height: 86px; padding: 0; border-radius: 50%;
    background-size: cover; background-position: center; border-width: 3px;
  }
  .qopts.qgrid button.correct { border-color: #0ca30c; box-shadow: 0 0 0 4px color-mix(in srgb, #0ca30c 35%, transparent); }
  .qopts.qgrid button.wrong { border-color: #d03b3b; box-shadow: 0 0 0 4px color-mix(in srgb, #d03b3b 35%, transparent); }
  .qbig { font-size: 40px; margin: 4px 0 8px; }
  .qnext { margin-top: 14px; }
  .qsub { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  /* ---------- legend ---------- */
  #legend {
    position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 5px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(4px);
    border: 1px solid var(--grid); border-radius: 10px; padding: 9px 12px;
    font-size: 11.5px; color: var(--ink-2); box-shadow: var(--shadow);
  }
  #legend .lg { display: flex; align-items: center; gap: 7px; }
  #legend .chip { width: 11px; height: 11px; border-radius: 3.5px; flex: none; }
  #legend #stats { color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  /* ---------- zoom controls ---------- */
  #zoomCtl {
    position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
  }
  #zoomCtl button { box-shadow: var(--shadow); font-size: 14px; width: 34px; height: 34px; justify-content: center; padding: 0; }
  #zoomCtl button.wide { width: auto; font-size: 11.5px; padding: 0 11px; }
  /* ---------- tip bar ---------- */
  #tipbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(4px);
    border: 1px solid var(--grid); box-shadow: var(--shadow);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--ink-2);
    display: flex; gap: 10px; align-items: center; max-width: min(92%, 640px); z-index: 15;
  }
  #tipbar b { color: var(--ink); }
  #tipbar button { padding: 3px 8px; font-size: 11px; flex: none; }
  /* ---------- side panel ---------- */
  #panel {
    position: absolute; top: 10px; right: 10px; width: 272px; max-height: calc(100% - 20px);
    overflow: auto; background: var(--surface); border: 1px solid var(--grid);
    border-radius: 12px; box-shadow: var(--shadow-lg); display: none; z-index: 30;
  }
  #panel .ph { padding: 14px 14px 10px; display: flex; gap: 11px; align-items: center; }
  #panel .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; overflow: hidden; border: 2px solid var(--grid);
    background-size: cover; background-position: center;
  }
  #panel .pname { font-size: 15px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  #panel .prel { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  #panel .pyears { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #panel .pnotes {
    font-size: 12px; color: var(--ink-2); padding: 0 14px 10px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #panel .pactions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 14px 12px; }
  #panel .pactions button { justify-content: center; font-size: 12px; padding: 7px 6px; }
  #panel .pactions button.span2 { grid-column: span 2; }
  #panel .danger { color: #d03b3b; border-color: color-mix(in srgb, #d03b3b 35%, var(--grid)); }
  #panel .pclose {
    position: absolute; top: 8px; right: 8px; border: none; background: transparent;
    font-size: 15px; padding: 4px 7px; color: var(--muted);
  }
  #panel .sec-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 14px 2px; }
  /* ---------- modal ---------- */
  #modalBg {
    position: fixed; inset: 0; background: rgba(11,11,11,.42); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  #modal {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
    width: 420px; max-width: 100%; max-height: 92vh; overflow: auto;
    border: 1px solid var(--grid);
  }
  #modal .mh { padding: 15px 18px 4px; font-size: 15px; font-weight: 700; }
  #modal .mb { padding: 10px 18px 6px; font-size: 13px; color: var(--ink-2); }
  #modal .mf { padding: 10px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; }
  #modal label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin: 10px 0 4px; }
  #modal input[type=text], #modal input[type=number], #modal select, #modal textarea {
    width: 100%; font-family: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--grid); border-radius: 7px; background: var(--page); color: var(--ink);
  }
  #modal input:focus, #modal select:focus, #modal textarea:focus { outline: none; border-color: var(--accent); }
  #modal textarea { resize: vertical; min-height: 54px; }
  #modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #modal .photoRow { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  #modal .photoPrev {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--grid);
    background-size: cover; background-position: center; display: none; flex: none;
  }
  #modal .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  #modal h4 { font-size: 12px; margin: 14px 0 2px; color: var(--ink); }
  #modal ul { margin: 6px 0 10px 18px; line-height: 1.55; }
  #modal .danger-btn { background: #d03b3b; border-color: #d03b3b; color: #fff; font-weight: 600; }
  /* ---------- toast ---------- */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--page); font-size: 13px; padding: 9px 16px;
    border-radius: 9px; box-shadow: var(--shadow-lg); transition: transform .25s ease; z-index: 200;
    max-width: 90%;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  @media (max-width: 720px) {
    #searchBox { width: 110px; }
    #treeTitle { width: 120px; }
    #panel { width: min(272px, calc(100% - 20px)); }
  }
  /* ================= v2: header rows, subbar, views ================= */
  .tb-row { display: contents; }
  #tbSpacer { flex: 1; order: 8; }
  #tbEnd { order: 9; }
  #subbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 6px 12px; background: var(--page); border-bottom: 1px solid var(--grid);
    font-size: 12px; z-index: 15; min-height: 38px;
  }
  #crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; min-width: 0; flex: 1 1 300px; }
  #treeTitle { width: 160px; }
  #searchBox { width: 150px; }
  .tb-sep { margin: 0; }
  #legend .lshort { display: none; }
  #crumbs button {
    border: none; background: transparent; padding: 4px 6px; font-size: 12px; color: var(--ink-2);
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: inline-block;
  }
  #crumbs button:hover { background: var(--surface); color: var(--ink); }
  #crumbs button.cur { color: var(--ink); font-weight: 700; }
  #crumbs .sep { color: var(--muted); font-size: 11px; }
  #crumbs .hint { color: var(--muted); font-size: 11.5px; padding: 0 4px; white-space: nowrap; }
  #legend {
    position: static; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 5px;
    background: transparent; backdrop-filter: none; border: none; box-shadow: none; padding: 0;
  }
  #legend .lchip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 10px;
    border-radius: 20px; background: var(--surface); border: 1px solid var(--grid); color: var(--ink-2);
  }
  #legend .lchip .chip { width: 10px; height: 10px; border-radius: 50%; }
  #legend .lchip.on { border-color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, var(--surface)); color: var(--ink); font-weight: 600; }
  #legend .lchip.off { opacity: .55; }
  #legend #stats { margin: 0 0 0 4px; }
  #viewport { position: relative; flex: 1; overflow: hidden; }
  #stage { display: flex; flex-direction: column; }

  /* tree svg cards */
  #svg .card .cstroke { transition: stroke-width .15s; }
  #svg .card.pulse .cstroke { animation: ftPulse .65s ease-in-out 4; }
  @keyframes ftPulse { 0%,100% { stroke: var(--accent); stroke-width: 2; } 50% { stroke: var(--accent); stroke-width: 7; } }
  #svg .card.onpath .cstroke { stroke: var(--side-d); stroke-width: 4; }
  #svg .fbtn:hover circle { stroke: var(--accent); }
  #svg .pathline { stroke: var(--side-d); stroke-width: 4; fill: none; stroke-dasharray: 9 7; stroke-linecap: round; opacity: .85; animation: ftDash 1s linear infinite; }
  @keyframes ftDash { to { stroke-dashoffset: -32; } }

  /* shared html person card */
  .pcard {
    --sc: var(--muted);
    display: flex; align-items: center; gap: 10px; width: 300px; max-width: 100%;
    background: var(--surface); border: 1px solid var(--grid); border-left: 4px solid var(--sc);
    border-radius: 10px; padding: 8px 10px; cursor: pointer; position: relative; text-align: left;
    transition: box-shadow .15s, opacity .2s;
  }
  .pcard:hover { box-shadow: var(--shadow); }
  .pcard.me { border-color: var(--sc); border-left-width: 4px; }
  .av {
    width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: var(--sc); background: color-mix(in srgb, var(--sc) 16%, transparent);
    background-size: cover; background-position: center;
  }
  .pc-main { flex: 1; min-width: 0; }
  .pc-name { font-size: 13.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .pc-name.unnamed { color: var(--muted); font-weight: 400; }
  .pc-rel { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; margin-top: 1px; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--page); border: 1px solid var(--grid); color: var(--ink-2); white-space: nowrap; }
  .tag.late { color: var(--muted); }
  .tag.you { color: var(--sc); border-color: var(--sc); font-weight: 700; }
  .dim { opacity: .22; }
  .pulse { animation: ftPulseBox .65s ease-in-out 4; }
  @keyframes ftPulseBox { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px var(--accent); } }
  .onpath { box-shadow: 0 0 0 3px var(--side-d) !important; opacity: 1 !important; }
  .npill {
    display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px;
    padding: 0 9px; border-radius: 12px; font-size: 11.5px; font-weight: 700; border: none;
    background: var(--sc, var(--muted)); color: #fff; cursor: pointer; flex: none;
  }
  .npill.open { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); font-weight: 600; }

  /* ---------- outline view ---------- */
  #outlineView { position: absolute; inset: 0; overflow: auto; display: none; background: var(--page); z-index: 5; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
  #outlineView .owrap { padding: 14px 14px 110px; min-width: max-content; }
  .osec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 2px 8px; }
  .osec:first-child { margin-top: 4px; }
  .onode { margin: 6px 0; }
  .orow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .orow .amp { color: var(--muted); font-size: 13px; padding: 0 2px; }
  .okids { margin-left: 20px; padding-left: 16px; border-left: 2px solid var(--grid); }
  #oCtl { position: absolute; right: 12px; bottom: 12px; display: none; gap: 5px; z-index: 12; align-items: center; }
  #oCtl button { box-shadow: var(--shadow); height: 34px; min-width: 34px; justify-content: center; }
  #oCtl .zl { font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--grid); border-radius: 7px; height: 34px; display: inline-flex; align-items: center; padding: 0 8px; box-shadow: var(--shadow); }

  /* ---------- columns view ---------- */
  #columnsView { position: absolute; inset: 0; display: none; overflow-x: auto; overflow-y: hidden; background: var(--page); z-index: 5; }
  #columnsView .cstrip { display: flex; height: 100%; min-width: max-content; }
  .ccol { width: 250px; flex: none; height: 100%; overflow-y: auto; border-right: 1px solid var(--grid); background: var(--surface); padding-bottom: 40px; }
  .ccol.detail { width: 300px; background: var(--page); }
  .chead { position: sticky; top: 0; background: inherit; z-index: 2; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px 7px; border-bottom: 1px solid var(--grid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .csub { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 12px 4px; }
  .crow {
    --sc: var(--muted);
    display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 8px; cursor: pointer;
    border-left: 4px solid var(--sc); border-bottom: 1px solid var(--hairline); transition: opacity .2s;
  }
  .crow:hover { background: var(--page); }
  .crow.sel { background: color-mix(in srgb, var(--accent) 13%, var(--surface)); }
  .crow.kbd { outline: 2px solid var(--accent); outline-offset: -2px; }
  .crow .avs { display: flex; flex: none; }
  .crow .av { width: 32px; height: 32px; font-size: 11.5px; border: 2px solid var(--surface); }
  .crow .av + .av { margin-left: -10px; }
  .cr-main { flex: 1; min-width: 0; }
  .cr-name { font-size: 13px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .cr-rel { font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cpill { font-size: 10.5px; font-weight: 700; color: var(--ink-2); background: var(--page); border: 1px solid var(--grid); border-radius: 10px; padding: 2px 7px; white-space: nowrap; flex: none; }
  .crow.sel .cpill { border-color: var(--accent); color: var(--accent); }
  .cleaf { color: var(--muted); font-size: 13px; flex: none; padding: 0 3px; }
  .cdet { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .cdet .pcard { width: 100%; }
  .cdet .dfacts { font-size: 12px; color: var(--ink-2); line-height: 1.55; padding: 0 2px; }
  .cdet .dbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .cdet .dbtns button { font-size: 11.5px; padding: 5px 9px; }

  /* ---------- profile pop-up ---------- */
  #panel { width: 320px; }
  #panel .pfacts { font-size: 12px; color: var(--ink-2); padding: 0 14px 8px; line-height: 1.55; }
  #panel .rrow { display: flex; gap: 8px; padding: 3px 14px; align-items: baseline; }
  #panel .rlab { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 62px; flex: none; }
  #panel .rchips { display: flex; flex-wrap: wrap; gap: 4px; }
  #panel .rchips button { font-size: 11.5px; padding: 3px 9px; border-radius: 14px; }
  #panel .ppath { font-size: 11.5px; color: var(--ink-2); padding: 8px 14px 4px; line-height: 1.5; }

<script>
"use strict";
/* ============================================================
   Gupta Family Tree — a little app for Vaibhav & his fiancée
   Everything lives in this one file. Data is saved by exporting
   a .json file (⬇ Save file) and re-importing it later.
   ============================================================ */

/* ================= constants, theme, state ================= */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
// layout dimensions — driven by density & orientation settings
let CARD_W = 172, CARD_H = 76, COUPLE_GAP = 20, UNIT_GAP = 30, ROW_H = 178;
let VERT = false, COMPACT = false;
function applyLayoutSettings(){
  COMPACT = state.settings.density === 'compact';
  VERT = state.settings.orient === 'v';
  CARD_W = COMPACT ? 112 : 210;
  CARD_H = COMPACT ? 36 : 86;
  COUPLE_GAP = COMPACT ? 10 : 20;
  UNIT_GAP = VERT ? (COMPACT ? 14 : 20) : (COMPACT ? 16 : 30);
  ROW_H = VERT ? CARD_W + (COMPACT ? 46 : 66) : (COMPACT ? 102 : 190);
}
const THEMES = {
  light: { page:'#f9f9f7', surface:'#fcfcfb', ink:'#0b0b0b', ink2:'#52514e', muted:'#898781',
           grid:'#e1e0d9', line:'#c3c2b7', hair:'rgba(11,11,11,0.10)',
           sides:{ P:'#2a78d6', M:'#008300', D:'#e87ba4', S:'#eda100', N:'#898781' } },
  dark:  { page:'#0d0d0d', surface:'#1a1a19', ink:'#ffffff', ink2:'#c3c2b7', muted:'#898781',
           grid:'#2c2c2a', line:'#383835', hair:'rgba(255,255,255,0.12)',
           sides:{ P:'#3987e5', M:'#008300', D:'#d55181', S:'#c98500', N:'#898781' } }
};
const SIDE_LABEL = { P:"Papa's side", M:"Mummy's side", D:"Direct line", S:"Married in", N:"Not linked yet" };

function themeName(){
  const t = state.settings.theme;
  if (t === 'light' || t === 'dark') return t;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function T(){ return THEMES[themeName()]; }

/* ---------------- state ---------------- */
let state = null;
let dirty = false, undoStack = [], redoStack = [];
let selectedId = null;
let view = { x: 0, y: 0, k: 1 };       // pan/zoom transform
let lastLayout = null;                  // {pos:{pid:{x,y}}, unions:{uid:{midX,midY,railY}}, bbox}

function newId(pfx){ state.seq++; return pfx + state.seq; }
function P(){ return state.people; }
function U(){ return state.unions; }

/* ---------------- derived indexes ---------------- */
let IDX = null;
function rebuildIndex(){
  IDX = { parentUnion: {}, unionsOf: {} };
  for (const [uid, u] of Object.entries(U())){
    u.p.forEach(pid => { (IDX.unionsOf[pid] = IDX.unionsOf[pid] || []).push(uid); });
    u.c.forEach(cid => { IDX.parentUnion[cid] = uid; });
  }
  if (!Array.isArray(state.collapsed)) state.collapsed = [];
  state.collapsed = state.collapsed.filter(uid => U()[uid] && U()[uid].c.length);
}

/* ---------------- branch collapsing ---------------- */
// everyone below a set of starting children: the children, their descendants,
// and spouses who married into those branches (kept if they're blood of a visible family)
function descendantsDown(startChildren){
  const set = new Set();
  const down = p => {
    if (set.has(p) || !P()[p]) return;
    set.add(p);
    for (const uid of unionsOf(p)){
      const u = U()[uid];
      u.c.forEach(down);
      u.p.forEach(q => { if (q !== p && !parentUnionOf(q)) down(q); });
    }
  };
  (startChildren || []).forEach(down);
  return set;
}
/* ---- roots: main families (my ancestors' top couples), in-law families, others ---- */
function rootInfo(){
  const me = state.meId && P()[state.meId] ? state.meId : null;
  const anc = new Set();
  if (me){ const q = [me]; while (q.length){ const a = q.pop(); if (anc.has(a)) continue; anc.add(a); parentsOf(a).forEach(p => q.push(p)); } }
  // connected component of "me"
  const comp = new Set();
  if (me){
    const q = [me];
    while (q.length){
      const a = q.pop(); if (comp.has(a)) continue; comp.add(a);
      for (const uid of unionsOf(a)){ U()[uid].p.forEach(x => q.push(x)); U()[uid].c.forEach(x => q.push(x)); }
      const pu = parentUnionOf(a); if (pu){ U()[pu].p.forEach(x => q.push(x)); U()[pu].c.forEach(x => q.push(x)); }
    }
  }
  const main = [], inlaw = [], other = [];
  for (const [uid, u] of Object.entries(U())){
    const ps = u.p.filter(p => P()[p]);
    if (!ps.length || ps.some(p => parentUnionOf(p))) continue;
    if (!me || ps.some(p => anc.has(p))) main.push(uid);
    else if (comp.has(ps[0])) { if (u.c.length) inlaw.push(uid); }
    else other.push(uid);
  }
  const lonely = Object.keys(P()).filter(pid => !parentUnionOf(pid) && !unionsOf(pid).length);
  const start = new Set();
  for (const uid of [...main, ...other]) U()[uid].p.forEach(p => start.add(p));
  lonely.forEach(p => start.add(p));
  if (!start.size && me) start.add(me);
  return { main, inlaw, other, lonely, start };
}
let FOCUS = null;           // union id used as the Tree's root, or null
let UP_PILLS = [];          // [{pid, uid}] married-in people whose own family is folded away
function computeVisible(){
  const vis = new Set(), q = [];
  const coll = new Set(state.collapsed);
  const noUp = new Set();
  const add = p => { if (P()[p] && !vis.has(p)){ vis.add(p); q.push(p); } };
  if (FOCUS && !U()[FOCUS]) FOCUS = null;
  if (FOCUS){ U()[FOCUS].p.forEach(p => { noUp.add(p); add(p); }); U()[FOCUS].c.forEach(add); }
  else rootInfo().start.forEach(add);
  while (q.length){
    const x = q.shift();
    for (const uid of unionsOf(x)){
      const u = U()[uid];
      u.p.forEach(add);
      if (uid === FOCUS || !coll.has(uid)) u.c.forEach(add);
    }
    const pu = parentUnionOf(x);
    if (pu && !noUp.has(x) && !coll.has(pu)){ U()[pu].p.forEach(add); U()[pu].c.forEach(add); }
  }
  UP_PILLS = [];
  for (const x of vis){
    const pu = parentUnionOf(x);
    if (!pu || noUp.has(x) || !coll.has(pu)) continue;
    if (U()[pu].p.some(p => vis.has(p))) continue;
    UP_PILLS.push({ pid: x, uid: pu });
  }
  return vis;
}
function hiddenSet(){
  const vis = computeVisible();
  return new Set(Object.keys(P()).filter(p => !vis.has(p)));
}
function toggleCollapse(uid){
  if (!U()[uid]) return;
  snapshot();
  const i = state.collapsed.indexOf(uid);
  if (i >= 0){ state.collapsed.splice(i, 1); commit(); }
  else { state.collapsed.push(uid); commit(); }
}
function expandAll(){
  if (!state.collapsed.length){ toast('Everything is already expanded'); return; }
  snapshot();
  state.collapsed = [];
  commit(); if (currentView() === 'tree') fitView();
  toast('All branches expanded');
}
// spine = the unions on my direct line upward (my parents, grandparents, great-grandparents…)
function defaultCollapsed(){
  const spine = new Set();
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (me){
    unionsOf(me).forEach(u => spine.add(u));
    const q = [me]; const seen = new Set();
    while (q.length){
      const a = q.pop();
      if (seen.has(a)) continue;
      seen.add(a);
      const pu = parentUnionOf(a);
      if (pu){ spine.add(pu); U()[pu].p.forEach(p => q.push(p)); }
    }
  }
  return Object.entries(U()).filter(([uid, u]) => u.c.length && !spine.has(uid)).map(([uid]) => uid);
}
function collapseAll(){
  const target = defaultCollapsed();
  const cur = new Set(state.collapsed);
  if (target.length === cur.size && target.every(t => cur.has(t))){ toast('Already as tidy as it gets'); return; }
  snapshot();
  state.collapsed = target;
  commit(); if (currentView() === 'tree') fitView();
  toast('Tidied up — your direct line stays; tap +N pills to explore branches');
}
// open every folded union on someone's blood line up to its root family
function openChain(pid, seen){
  seen = seen || new Set();
  if (!P()[pid] || seen.has(pid)) return;
  seen.add(pid);
  const pu = parentUnionOf(pid);
  if (pu){
    state.collapsed = state.collapsed.filter(x => x !== pu);
    const bp = U()[pu].p.find(p => parentUnionOf(p)) || null;
    if (bp) openChain(bp, seen);
  } else {
    // married in (no parents on record): they show up beside their spouse
    spousesOf(pid).filter(s => parentUnionOf(s)).slice(0, 1).forEach(s => openChain(s, seen));
  }
}
// make sure pid is drawn in the Tree: find the shortest family path from what is
// already drawn and unfold every union along it (leaving focus if needed)
function treePathUnions(pid){
  const vis = computeVisible();
  const noUp = new Set(FOCUS && U()[FOCUS] ? U()[FOCUS].p : []);
  const prev = new Map();
  const q = [...vis];
  vis.forEach(v => prev.set(v, null));
  while (q.length){
    const x = q.shift();
    if (x === pid) break;
    const step = (y, uid) => { if (P()[y] && !prev.has(y)){ prev.set(y, { from: x, uid }); q.push(y); } };
    for (const uid of unionsOf(x)){ U()[uid].p.forEach(y => step(y, null)); U()[uid].c.forEach(y => step(y, uid)); }
    const pu = parentUnionOf(x);
    if (pu && !noUp.has(x)){ U()[pu].p.forEach(y => step(y, pu)); U()[pu].c.forEach(y => step(y, pu)); }
  }
  if (!prev.has(pid)) return null;
  const out = []; let cur = pid;
  while (prev.get(cur)){ const pr = prev.get(cur); if (pr.uid) out.push(pr.uid); cur = pr.from; }
  return out;
}
function expandToReveal(pid){
  if (!P()[pid] || computeVisible().has(pid)) return false;
  snapshot();
  let opened = treePathUnions(pid);
  if (opened == null && FOCUS){ FOCUS = null; if (computeVisible().has(pid)) return true; opened = treePathUnions(pid); }
  if (opened) state.collapsed = state.collapsed.filter(x => !opened.includes(x));
  markDirty();
  return true;
}
function parentUnionOf(pid){ return IDX.parentUnion[pid] || null; }
function unionsOf(pid){ return IDX.unionsOf[pid] || []; }
function parentsOf(pid){ const u = parentUnionOf(pid); return u ? U()[u].p : []; }
function siblingsOf(pid){
  const u = parentUnionOf(pid); if (!u) return [];
  return U()[u].c.filter(c => c !== pid);
}
function spousesOf(pid){
  return unionsOf(pid).flatMap(uid => U()[uid].p.filter(x => x !== pid));
}

/* ---------------- seed family ---------------- */
function makePerson(name, g, extra){
  const p = Object.assign({ name: name||'', g: g||'', by:'', dy:'', call:'', notes:'', photo:'', adj:'' }, extra||{});
  for (const k of Object.keys(p)) if (k.startsWith('_')) delete p[k];   // form-only fields
  return p;
}
function seedState(){
  const people = {}, unions = {};
  const add = (id, name, g, extra) => { people[id] = makePerson(name, g, extra); return id; };

  // great-grandparents (Dada ji's parents)
  add('ppgf','','m'); add('ppgm','','f');
  // Dada ji + his 4 brothers + 1 sister
  add('db1','','m'); add('db2','','m'); add('dada','Dada ji','m'); add('db3','','m'); add('db4','','m'); add('ds1','','f');
  // great-grandparents (Dadi ji's parents)
  add('pmgf','','m'); add('pmgm','','f');
  // Dadi ji + her 3 sisters + 2 brothers
  add('dgb1','','m'); add('dgb2','','m'); add('dadi','Dadi ji','f'); add('dgs1','','f'); add('dgs2','','f'); add('dgs3','','f');
  // parents' generation
  add('papa','Papa','m'); add('bua','','f');
  add('nana','Nana ji','m'); add('nani','Nani ji','f');
  add('mama','','m'); add('mummy','Mummy','f'); add('mausi','','f');
  // you + fiancée
  add('me','Vaibhav','m'); add('fian','','f');

  unions.u1 = { p:['ppgf','ppgm'], c:['db1','db2','dada','db3','db4','ds1'], t:'m' };
  unions.u2 = { p:['pmgf','pmgm'], c:['dgb1','dgb2','dadi','dgs1','dgs2','dgs3'], t:'m' };
  unions.u3 = { p:['dada','dadi'], c:['papa','bua'], t:'m' };
  unions.u4 = { p:['nana','nani'], c:['mama','mummy','mausi'], t:'m' };
  unions.u5 = { p:['papa','mummy'], c:['me'], t:'m' };
  unions.u6 = { p:['me','fian'], c:[], t:'e' };

  return {
    v: 3, title: 'Gupta Family Tree', seq: 100, meId: 'me',
    settings: { lang: 'en', theme: 'auto' },
    collapsed: [],
    people, unions
  };
}

/* ---------------- mutations (with undo) ---------------- */
function snapshot(){
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 80) undoStack.shift();
  redoStack = [];
}
function markDirty(){
  dirty = true;
  document.getElementById('dirty').style.display = 'inline-flex';
}
function commit(){ rebuildIndex(); markDirty(); render(); }

function addSpouse(pid, props, status){
  snapshot();
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  // if pid has a single-parent union (children but no partner), attach there
  const single = unionsOf(pid).map(uid => U()[uid]).find(u => u.p.length === 1);
  if (single && status !== 'e'){ single.p.push(nid); if (status) single.t = status; }
  else { U()[newId('u')] = { p: [pid, nid], c: [], t: status || 'm' }; }
  commit(); return nid;
}
function addChild(pid, props, unionId){
  snapshot();
  let uid = unionId;
  if (!uid){
    const us = unionsOf(pid);
    uid = us[0];
    if (!uid){ uid = newId('u'); U()[uid] = { p: [pid], c: [], t: 'm' }; }
  }
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  U()[uid].c.push(nid);
  commit(); return nid;
}
function addSibling(pid, props){
  snapshot();
  let uid = parentUnionOf(pid);
  if (!uid){ // create placeholder parents
    uid = newId('u');
    const f = newId('p'), m = newId('p');
    P()[f] = makePerson('', 'm'); P()[m] = makePerson('', 'f');
    U()[uid] = { p: [f, m], c: [pid], t: 'm' };
  }
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  U()[uid].c.push(nid);
  commit(); return nid;
}
function addParents(pid){
  snapshot();
  const uid = newId('u');
  const f = newId('p'), m = newId('p');
  P()[f] = makePerson('', 'm'); P()[m] = makePerson('', 'f');
  U()[uid] = { p: [f, m], c: [pid], t: 'm' };
  commit(); return uid;
}
function addRootPerson(props){
  snapshot();
  const nid = newId('p');
  P()[nid] = makePerson(props.name, props.g, props);
  commit(); return nid;
}
function updatePerson(pid, props){
  snapshot();
  Object.assign(P()[pid], props);
  commit();
}
function deletePerson(pid){
  snapshot();
  for (const [uid, u] of Object.entries(U())){
    u.p = u.p.filter(x => x !== pid);
    u.c = u.c.filter(x => x !== pid);
  }
  for (const [uid, u] of Object.entries(U())){
    if (u.p.length === 0) delete U()[uid];             // parents gone → children become roots
    else if (u.p.length === 1 && u.c.length === 0) delete U()[uid];
  }
  delete P()[pid];
  if (state.meId === pid) state.meId = null;
  if (selectedId === pid) selectedId = null;
  commit();
}
function moveSibling(pid, dir){
  const uid = parentUnionOf(pid); if (!uid) return;
  const arr = U()[uid].c, i = arr.indexOf(pid), j = i + dir;
  if (j < 0 || j >= arr.length) return;
  snapshot();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  commit();
}
function undo(){

    mnx = Math.min(mnx, p.x - CARD_W / 2); mxx = Math.max(mxx, p.x + CARD_W / 2);

// order units within a rank: sibling groups stay contiguous, couples that bridge
// two families sit between them, then order by current x
function rankOrder(arr){
  const keyOf = u => {
    const pks = [...new Set(u.members.map(m => parentUnionOf(m)).filter(Boolean))].sort();
    return pks.length ? pks.join('|') : 'solo:' + u.id;
  };
  const dx = u => (u.des != null ? u.des : u.x);
  const groups = {};
  for (const u of arr){ const k = keyOf(u); (groups[k] = groups[k] || []).push(u); }
  const glist = Object.entries(groups).map(([k, g]) => ({ k, g, avg: g.reduce((s, u) => s + dx(u), 0) / g.length }));
  glist.sort((a, b) => a.avg - b.avg);
  for (const gl of glist){
    // pure sibling group → keep the parents' child order (birth order);
    // bridges & solos → order by desired position
    if (!gl.k.startsWith('solo:') && !gl.k.includes('|') && U()[gl.k]){
      const cOrder = U()[gl.k].c;
      const idx = u => Math.min(...u.members.map(m => { const i = cOrder.indexOf(m); return i < 0 ? 999 : i; }));
      gl.g.sort((a, b) => idx(a) - idx(b));
    } else {
      gl.g.sort((a, b) => dx(a) - dx(b));
    }
  }
  return glist.flatMap(gl => gl.g);
}
// order couple members so marriage partners sit adjacent; anchor (blood) person keeps family orientation
function orderUnitMembers(members){
  if (members.length === 2) return members.slice();
  // greedy chain: start with the member having most partners in this unit, alternate sides
  const set = new Set(members);
  const partnersIn = pid => spousesOf(pid).filter(s => set.has(s));
  const start = members.slice().sort((a, b) => partnersIn(b).length - partnersIn(a).length)[0];
  const chain = [start];
  const used = new Set([start]);
  let side = 1;
  let frontier = [start, start]; // [leftEnd, rightEnd]
  while (used.size < members.length){
    let extended = false;
    for (const endIdx of [1, 0]){
      const end = frontier[endIdx];
      const nxt = partnersIn(end).find(s => !used.has(s));
      if (nxt){
        if (endIdx === 1){ chain.push(nxt); frontier[1] = nxt; }
        else { chain.unshift(nxt); frontier[0] = nxt; }
        used.add(nxt); extended = true;
      }
    }
    if (!extended){
      const rest = members.find(m => !used.has(m));
      chain.push(rest); used.add(rest); frontier[1] = rest;
    }
  }
  return chain;
}

function wrapN(s, budget, maxLines){
  const words = String(s || '').split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for (const w of words){
    const next = cur ? cur + ' ' + w : w;
    if (next.length <= budget || !cur){ cur = next; }
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines){
    const keep = lines.slice(0, maxLines);
    keep[maxLines - 1] = truncate(lines.slice(maxLines - 1).join(' '), budget);
    return keep;
  }
  return lines.map(l => l.length > budget ? truncate(l, budget) : l);
}

    const c = pos[up.pid]; if (!c) continue;
    const u = U()[up.uid];
    const n = u.p.filter(p => P()[p]).length + descendantsDown(u.c.filter(x => x !== up.pid)).size;
    const x = VERT ? c.x - CARD_W/2 - 13 : c.x, y = VERT ? c.y : c.y - CARD_H/2 - 13;
    badges += pillSvg(up.uid, x, y, n, t.sides.S, VERT ? 'left' : 'up', t, `Show ${nm(up.pid)}’s own family (${n})`);
  }

  /* ---- person cards ---- */
  for (const [pid, p] of Object.entries(P())){
    const c = pos[pid]; if (!c) continue;
    const side = sides[pid], sc = t.sides[side] || t.muted;
    const rel = relationEntry(paths, pid);
    const rtext = relText(pid);
    const isMe = pid === state.meId, isSel = pid === selectedId;
    const stroke = isSel ? t.sides.P : isMe ? sc : t.hair;
    const sw = isSel ? 2.5 : isMe ? 2 : 1;
    const name = displayName(p);
    const x0 = -CARD_W/2;
    let inner;
    if (COMPACT){
      const label = name ? truncate(name.trim().split(/\s+/)[0], 11) : '—';
      let av;
      if (p.photo){
        defs += `<clipPath id="cp_${pid}"><circle cx="${x0 + 19}" cy="0" r="11"/></clipPath>`;
        av = `<image href="${p.photo}" x="${x0 + 8}" y="-11" width="22" height="22" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp_${pid})"/>`;
      } else {
        av = `<circle cx="${x0 + 19}" cy="0" r="11" fill="${sc}" opacity="0.16"/>`
           + `<text x="${x0 + 19}" y="3.5" font-size="9" font-weight="700" fill="${sc}" text-anchor="middle">${esc(initialsOf(p))}</text>`;
      }
      inner = av + `<text x="${x0 + 34}" y="4" font-size="11.5" font-weight="600" fill="${name ? t.ink : t.muted}">${esc(label)}</text>`;
    } else {
      const tx = x0 + 60;
      const nameLines = name ? wrapN(name, 19, 2) : ['—'];
      let relLines = rtext ? wrapN(rtext, 24, 2) : [];
      const tags = cardTags(pid);
      if (nameLines.length + relLines.length > 3 && tags.length) relLines = relLines.slice(0, 1);
      const hName = 16, hRel = 14, hTag = 16;
      const total = nameLines.length * hName + relLines.length * hRel + (tags.length ? hTag : 0);
      let y = -total / 2;
      let txt = '';
      for (const l of nameLines){ y += hName; txt += `<text x="${tx}" y="${y - 4}" font-size="13.5" font-weight="600" fill="${name ? t.ink : t.muted}">${esc(l)}</text>`; }
      for (const l of relLines){ y += hRel; txt += `<text x="${tx}" y="${y - 3}" font-size="11.5" fill="${t.ink2}">${esc(l)}</text>`; }
      if (tags.length){
        let tx2 = tx; const ty = y + 2;
        for (const [kind, label] of tags){
          const lab = truncate(label, 16);
          const w = Math.round(lab.length * 5.6 + 12);
          if (tx2 + w > CARD_W/2 - 26) break;
          const col = kind === 'you' ? sc : t.ink2;
          txt += `<rect x="${tx2}" y="${ty}" width="${w}" height="13" rx="6.5" fill="${kind === 'you' ? sc : t.page}" ${kind === 'you' ? 'fill-opacity="0.15"' : ''} stroke="${kind === 'you' ? sc : t.grid}" stroke-width="0.8"/>`
              + `<text x="${tx2 + w/2}" y="${ty + 9.6}" font-size="9.5" text-anchor="middle" fill="${col}" ${kind === 'you' ? 'font-weight="700"' : ''}>${esc(lab)}</text>`;
          tx2 += w + 4;
        }
      }
      let avatar;
      const ax = x0 + 31;
      if (p.photo){
        defs += `<clipPath id="cp_${pid}"><circle cx="${ax}" cy="0" r="19"/></clipPath>`;
        avatar = `<image href="${p.photo}" x="${ax - 19}" y="-19" width="38" height="38" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp_${pid})"/>`
               + `<circle cx="${ax}" cy="0" r="19" fill="none" stroke="${t.grid}" stroke-width="1"/>`;
      } else {
        avatar = `<circle cx="${ax}" cy="0" r="19" fill="${sc}" opacity="0.16"/>`
               + `<text x="${ax}" y="4.6" font-size="13" font-weight="700" fill="${sc}" text-anchor="middle">${esc(initialsOf(p))}</text>`;
      }
      const focusU = focusUnionOf(pid);
      const showF = focusU && (U()[focusU].p.find(x => parentUnionOf(x)) || U()[focusU].p[0]) === pid;
      const fbtn = showF && focusU !== FOCUS ? `<g class="fbtn" data-uid="${focusU}" transform="translate(${CARD_W/2 - 14},${CARD_H/2 - 14})" style="cursor:pointer">
          <title>Focus on this family</title><circle r="14" fill="transparent"/>
          <circle r="9.5" fill="${t.surface}" stroke="${t.line}" stroke-width="1.2"/>
          <text x="0" y="4.2" font-size="12" text-anchor="middle" fill="${t.ink2}">⤢</text></g>` : '';
      inner = avatar + txt + fbtn;
    }
    const dim = isDim(pid, sides);
    nodes += `<g class="card" data-pid="${pid}" transform="translate(${c.x},${c.y})" style="cursor:pointer"${dim ? ' opacity="0.22"' : ''}>
      <title>${esc(name || '—')}${rtext ? ' — ' + esc(rtext) : ''}</title>
      <g clip-path="url(#cardclip)"><rect x="${x0}" y="${-CARD_H/2}" width="${CARD_W}" height="${CARD_H}" fill="${t.surface}"/><rect x="${x0}" y="${-CARD_H/2}" width="4" height="${CARD_H}" fill="${sc}"/></g>
      <rect class="cstroke" x="${x0}" y="${-CARD_H/2}" width="${CARD_W}" height="${CARD_H}" rx="${COMPACT ? 8 : 10}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>
      ${inner}
    </g>`;
  }

  svg.innerHTML = `<defs>${defs}</defs><g id="vp"><g id="edges">${edges}</g><g id="badges">${badges}</g><g id="nodes">${nodes}</g><g id="toggles">${toggles}</g></g>`;
  if (firstRender && !noFit && svg.getBoundingClientRect().width){ initialTreeView(); firstRender = false; }
  applyView();
}
function pillSvg(uid, x, y, n, color, dir, t, title){
  const label = '+' + n;
  const bw = 20 + String(n).length * 7;
  const cx = dir === 'right' ? x + bw/2 : dir === 'left' ? x - bw/2 : x;
  const stub = dir === 'down' ? `<line x1="0" y1="-13" x2="0" y2="-9" stroke="${t.line}" stroke-width="1.6"/>`
             : dir === 'up' ? `<line x1="0" y1="10" x2="0" y2="13" stroke="${t.line}" stroke-width="1.6"/>`
             : dir === 'right' ? `<line x1="${-bw/2 - 5}" y1="0" x2="${-bw/2 - 1}" y2="0" stroke="${t.line}" stroke-width="1.6"/>`
             : `<line x1="${bw/2 + 1}" y1="0" x2="${bw/2 + 5}" y2="0" stroke="${t.line}" stroke-width="1.6"/>`;
  return `<g class="clps" data-uid="${uid}" transform="translate(${cx},${y})" style="cursor:pointer">
    <title>${esc(title || `Show ${n} hidden family member${n === 1 ? '' : 's'}`)}</title>
    <rect x="${-bw/2 - 8}" y="-16" width="${bw + 16}" height="34" fill="transparent"/>
    ${stub}
    <rect x="${-bw/2}" y="-9" width="${bw}" height="19" rx="9.5" fill="${color}"/>
    <text x="0" y="4.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${label}</text>
  </g>`;
}
// the family a ⤢ button focuses: the person's own couple with children
function focusUnionOf(pid){
  return unionsOf(pid).find(uid => U()[uid].c.length) || null;
}
function setFocus(uid){
  FOCUS = uid && U()[uid] ? uid : null;
  if (FOCUS) state.collapsed = state.collapsed.filter(x => x !== FOCUS);
  if (currentView() !== 'tree'){ state.settings.view = 'tree'; }
  render(); fitView();
}
// the chain of couples from the top of the family down to a union
function unionChain(uid){
  const chain = [uid]; const seen = new Set([uid]);
  let cur = uid;
  while (true){
    const bp = U()[cur].p.find(p => parentUnionOf(p));
    if (!bp) break;
    const pu = parentUnionOf(bp);
    if (seen.has(pu)) break;
    seen.add(pu); chain.unshift(pu); cur = pu;
  }
  return chain;
}

/* ---------------- breadcrumbs (Tree + Columns) ---------------- */
function renderCrumbs(){
  const el = document.getElementById('crumbs');
  const mode = currentView();

  if (mode === 'tree'){
    html = `<button data-cr="tree:" class="${FOCUS ? '' : 'cur'}">🏠 Whole family</button>`;
    if (FOCUS){

      });

  } else if (mode === 'columns'){
    html = `<button data-cr="col:0" class="${colPath.length ? '' : 'cur'}">🏠 Families</button>`;
    colPath.forEach((key, i) => {
      const lab = rowLabel(key);
      html += sep + `<button data-cr="col:${i + 1}" class="${i === colPath.length - 1 ? 'cur' : ''}" title="${esc(lab)}">${esc(lab)}</button>`;

    else { colPath = colPath.slice(0, parseInt(v)); colKbd = Math.max(0, colPath.length - 1); render(); }

}

/* ---------------- Outline view ---------------- */
let outlineZoom = 1;
function renderOutline(){
  const t = T();
  const wrap = document.querySelector('#outlineView .owrap');
  const R = rootInfo();
  const coll = new Set(state.collapsed);
  const done = new Set();      // everyone shown somewhere (for the "not linked" section)
  const stack = new Set();     // cycle guard for the current branch
  const personNode = pid => {
    if (stack.has(pid)) return '';
    stack.add(pid); done.add(pid);
    const sc = t.sides[RC.sides[pid]] || t.muted;
    let lead = '', rest = '', kidsHtml = '';
    for (const uid of unionsOf(pid)){
      const u = U()[uid];
      const pill = u.c.length ? htmlPill(uid, sc) : '';
      const sp = u.p.filter(s => s !== pid && P()[s]);
      sp.forEach((s, i) => { rest += `<span class="amp">&amp;</span>` + htmlCard(s, i === sp.length - 1 ? pill : ''); done.add(s); });
      if (!sp.length) lead += pill;
      if (u.c.length && !coll.has(uid)) kidsHtml += `<div class="okids">${u.c.filter(c => P()[c]).map(personNode).join('')}</div>`;
    }
    const row = htmlCard(pid, lead) + rest;
    stack.delete(pid);
    return `<div class="onode"><div class="orow">${row}</div>${kidsHtml}</div>`;
  };
  const unionNode = uid => {
    const u = U()[uid];
    const ps = u.p.filter(p => P()[p]);
    ps.forEach(p => { done.add(p); stack.add(p); });
    const sc = t.sides[RC.sides[ps[0]]] || t.muted;
    const pill = u.c.length ? htmlPill(uid, sc) : '';
    const row = ps.map((p, i) => htmlCard(p, i === ps.length - 1 ? pill : '')).join('<span class="amp">&amp;</span>');
    let kids = '';
    if (u.c.length){
      if (!coll.has(uid)) kids = `<div class="okids">${u.c.filter(c => P()[c]).map(personNode).join('')}</div>`;
    }
    ps.forEach(p => stack.delete(p));
    return `<div class="onode"><div class="orow">${row}</div>${kids}</div>`;
  };
  let html = '';
  if (R.main.length) html += `<div class="osec">Family · ${R.main.length} root couple${R.main.length === 1 ? '' : 's'}</div>` + R.main.map(unionNode).join('');
  if (R.inlaw.length) html += `<div class="osec">Families married in</div>` + R.inlaw.map(unionNode).join('');
  if (R.other.length) html += `<div class="osec">Other families</div>` + R.other.map(unionNode).join('');
  const rest = R.lonely.filter(pid => !done.has(pid));
  if (rest.length) html += `<div class="osec">Not linked yet</div>` + rest.map(personNode).join('');
  wrap.innerHTML = html;
  wrap.style.zoom = outlineZoom;
  document.getElementById('oZl').textContent = Math.round(outlineZoom * 100) + '%';
  wrap.querySelectorAll('.pcard').forEach(c => c.onclick = () => { selectedId = c.dataset.pid; renderPanel(); });
  wrap.querySelectorAll('.npill').forEach(b => b.onclick = e => { e.stopPropagation(); toggleCollapse(b.dataset.uid); });
  lastShown = { shown: wrap.querySelectorAll('.pcard').length, total: Object.keys(P()).length };
}
function setOutlineZoom(k){
  outlineZoom = Math.min(2, Math.max(0.5, Math.round(k * 100) / 100));
  const wrap = document.querySelector('#outlineView .owrap');
  wrap.style.zoom = outlineZoom;
  document.getElementById('oZl').textContent = Math.round(outlineZoom * 100) + '%';
}

/* ---------------- Columns view (Finder-style) ---------------- */
let colPath = [];   // row keys: 'u:<union>' for a root couple, 'p:<person>' for a child (+ their spouse)
let colKbd = 0;     // column that arrow keys move in
function rowKids(key){
  const [k, id] = [key.slice(0, 1), key.slice(2)];
  if (k === 'u') return U()[id] ? U()[id].c.filter(c => P()[c]) : [];
  return P()[id] ? childrenOfAll(id).filter(c => P()[c]) : [];
}
function rowPeople(key){
  const [k, id] = [key.slice(0, 1), key.slice(2)];
  if (k === 'u') return U()[id] ? U()[id].p.filter(p => P()[p]) : [];
  return P()[id] ? [id, ...spousesOf(id).filter(s => P()[s])] : [];
}
function rowLabel(key){
  if (key.startsWith('u:')) return familyLabel(key.slice(2));
  return coupleName(rowPeople(key));
}
function rowValid(key){ return key.startsWith('u:') ? !!U()[key.slice(2)] : !!P()[key.slice(2)]; }
function colRowsFor(i){
  if (i === 0){
    const R = rootInfo();
    const rows = [];
    R.main.forEach(uid => rows.push({ key: 'u:' + uid }));
    if (R.inlaw.length){ rows.push({ sub: 'Families married in' }); R.inlaw.forEach(uid => rows.push({ key: 'u:' + uid })); }
    if (R.other.length){ rows.push({ sub: 'Other families' }); R.other.forEach(uid => rows.push({ key: 'u:' + uid })); }
    if (R.lonely.length){ rows.push({ sub: 'Not linked yet' }); R.lonely.forEach(pid => rows.push({ key: 'p:' + pid })); }
    return rows;
  }
  return rowKids(colPath[i - 1]).map(c => ({ key: 'p:' + c }));
}
function colPathFor(pid){
  // blood line up to a root couple; married-in people use their spouse's line
  let target = pid;
  if (!parentUnionOf(pid)){
    const ru = unionsOf(pid).find(uid => U()[uid].p.every(p => !parentUnionOf(p)) && U()[uid].c.length);
    if (ru) return ['u:' + ru];
    const s = spousesOf(pid).find(x => parentUnionOf(x));
    if (s) target = s; else return ['p:' + pid];
  }
  const path = []; let cur = target; const seen = new Set();
  while (cur && !seen.has(cur)){
    seen.add(cur);
    const pu = parentUnionOf(cur);
    if (!pu){ break; }
    path.unshift('p:' + cur);
    const bp = U()[pu].p.find(p => parentUnionOf(p));
    if (bp) cur = bp;
    else { path.unshift('u:' + pu); break; }
  }
  return path;
}
function renderColumns(){
  const t = T();
  const strip = document.querySelector('#columnsView .cstrip');
  colPath = colPath.filter(rowValid);
  // drop path entries that are no longer children of the previous row
  for (let i = 1; i < colPath.length; i++){
    if (!rowKids(colPath[i - 1]).includes(colPath[i].slice(2))){ colPath = colPath.slice(0, i); break; }
  }
  if (colPath.length && colPath[0].startsWith('p:') && !rootInfo().lonely.includes(colPath[0].slice(2))) colPath = [];
  const rowHtml = (key, i) => {
    const ppl = rowPeople(key);
    const kids = rowKids(key);
    const lead = ppl[0];
    const sc = t.sides[RC.sides[lead]] || t.muted;
    const sel = colPath[i] === key;
    const dim = sideFilter && ppl.every(p => isDim(p, RC.sides));
    const avs = ppl.slice(0, 2).map(p => htmlAvatar(p, t.sides[RC.sides[p]] || t.muted)).join('');
    const rels = key.startsWith('u:') ? ppl.map(relText).filter(Boolean).join(' · ') : relText(lead);
    const name = key.startsWith('u:') ? familyLabel(key.slice(2)) : coupleName(ppl);
    const right = kids.length ? `<span class="cpill" title="${kids.length} children · ${descendantsDown(kids).size} in all below">${kids.length} · ${descendantsDown(kids).size} ›</span>` : `<span class="cleaf">›</span>`;
    return `<div class="crow${sel ? ' sel' : ''}${dim ? ' dim' : ''}" data-key="${key}" data-col="${i}" data-pids="${ppl.join(',')}" style="--sc:${sc}">
      <span class="avs">${avs}</span>
      <div class="cr-main"><div class="cr-name">${esc(name)}</div>${rels ? `<div class="cr-rel">${esc(rels)}</div>` : ''}</div>${right}</div>`;
  };
  let html = '';
  const ncols = colPath.length + 1;
  for (let i = 0; i < ncols; i++){
    if (i > 0 && !rowKids(colPath[i - 1]).length){
      html += detailColumn(colPath[i - 1]);
      break;
    }
    const rows = colRowsFor(i);
    const head = i === 0 ? 'Root families' : `Children of ${rowLabel(colPath[i - 1])}`;
    html += `<div class="ccol" data-col="${i}"><div class="chead" title="${esc(head)}">${esc(head)}</div>${rows.map(r => r.sub ? `<div class="csub">${esc(r.sub)}</div>` : rowHtml(r.key, i)).join('')}</div>`;
  }
  strip.innerHTML = html;
  strip.querySelectorAll('.crow').forEach(r => r.onclick = () => {
    const i = parseInt(r.dataset.col);
    colPath = colPath.slice(0, i).concat(r.dataset.key);
    colKbd = i;
    render();
    scrollColumnsEnd();
  });
  strip.querySelectorAll('.cdet .pcard').forEach(c => c.onclick = () => { selectedId = c.dataset.pid; renderPanel(); });
  strip.querySelectorAll('[data-dact]').forEach(b => b.onclick = () => {
    const [act, pid] = b.dataset.dact.split(':');
    if (act === 'profile'){ selectedId = pid; renderPanel(); }
    else if (act === 'path') showRelPath(pid);
    else if (act === 'edit') openEditModal(pid);
  });
  const kr = strip.querySelector(`.ccol[data-col="${colKbd}"] .crow.sel`);
  if (kr) kr.classList.add('kbd');
  lastShown = { shown: Object.keys(P()).length, total: Object.keys(P()).length };
}
function detailColumn(key){
  const ppl = rowPeople(key);
  let html = `<div class="ccol detail"><div class="chead">${esc(rowLabel(key))}</div><div class="cdet">`;
  for (const pid of ppl){
    const p = P()[pid];
    const facts = [];
    if (p.call) facts.push(`Pet name: “${esc(p.call)}”`);
    if (yearsLine(p)) facts.push(esc(yearsLine(p)));
    const kids = childrenOfAll(pid);
    if (kids.length) facts.push(`Children: ${kids.map(k => esc(nm(k))).join(', ')}`);
    const par = parentsOf(pid);
    if (par.length) facts.push(`Parents: ${esc(coupleName(par))}`);
    if (p.notes) facts.push(esc(p.notes));
    html += htmlCard(pid)
      + (facts.length ? `<div class="dfacts">${facts.join('<br>')}</div>` : '')
      + `<div class="dbtns"><button data-dact="profile:${pid}">👤 Profile</button>${pid !== state.meId ? `<button data-dact="path:${pid}">🧭 Path</button>` : ''}<button data-dact="edit:${pid}">✏️ Edit</button></div>`;
  }
  return html + '</div></div>';
}
function scrollColumnsEnd(){
  const cv = document.getElementById('columnsView');
  requestAnimationFrame(() => { cv.scrollLeft = cv.scrollWidth; });
}
function columnsKey(e){
  const k = e.key;
  if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) return false;
  e.preventDefault();
  if (k === 'ArrowLeft'){
    if (colKbd > 0){ colPath = colPath.slice(0, colKbd); colKbd--; }
    else if (colPath.length > 1) colPath = colPath.slice(0, 1);
  } else if (k === 'ArrowRight'){
    const cur = colPath[colKbd];
    if (cur){
      const kids = rowKids(cur);
      if (kids.length){ colPath = colPath.slice(0, colKbd + 1).concat('p:' + kids[0]); colKbd++; }
    } else {
      const rows = colRowsFor(0).filter(r => r.key);
      if (rows.length){ colPath = [rows[0].key]; colKbd = 0; }
    }
  } else {
    const rows = colRowsFor(colKbd).filter(r => r.key).map(r => r.key);
    if (!rows.length) return true;
    const i = rows.indexOf(colPath[colKbd]);
    const j = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + (k === 'ArrowDown' ? 1 : -1)));
    colPath = colPath.slice(0, colKbd).concat(rows[j]);
  }
  render();
  const sel = document.querySelector(`#columnsView .ccol[data-col="${colKbd}"] .crow.sel`);
  if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  scrollColumnsEnd();
  return true;
}

/* ---------------- locate / pulse / relationship path ---------------- */
function pulseEls(els){

/* ---- pan & zoom ---- */
function applyView(){
  const vp = document.getElementById('vp');
  if (vp) vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}
function fitView(){
  if (!lastLayout) return;
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const b = lastLayout.bbox;
  const k = Math.min(r.width / b.w, r.height / b.h, 1.2);
  view.k = Math.max(k, 0.08);
  view.x = (r.width - b.w * view.k) / 2 - b.x * view.k;
  view.y = (r.height - b.h * view.k) / 2 - b.y * view.k;
  applyView();
}
// first look at the Tree: everything if it is readable, otherwise my immediate family
function initialTreeView(){
  fitView();
  if (view.k >= 0.45 || FOCUS) return;
  const me = state.meId && P()[state.meId] ? state.meId : null;
  if (!me) return;
  const par = parentsOf(me);
  const ids = [me, ...spousesOf(me), ...siblingsOf(me), ...par, ...par.flatMap(parentsOf)];
  fitToPids(ids);
}
function zoomAt(cx, cy, f){
  const nk = Math.min(2.5, Math.max(0.08, view.k * f));
  const real = nk / view.k;
  view.x = cx - (cx - view.x) * real;
  view.y = cy - (cy - view.y) * real;
  view.k = nk;
  applyView();
}
function centerOn(pid){
  if (!lastLayout || !lastLayout.pos[pid]) return;
  const r = svg.getBoundingClientRect();
  const p = lastLayout.pos[pid];
  view.k = Math.min(1.2, Math.max(view.k, 0.85));
  view.x = r.width / 2 - p.x * view.k;
  view.y = r.height / 2 - p.y * view.k;
  applyView();
}

function renderPanel(){
  const panel = document.getElementById('panel');
  const pid = selectedId;
  if (!pid || !P()[pid] || currentView() === 'quiz'){ panel.style.display = 'none'; return; }
  const p = P()[pid];
  const t = T();
  const sides = RC ? RC.sides : computeSides();
  const sc = t.sides[sides[pid]] || t.muted;
  const paths = RC ? RC.paths : allPathsFromMe();
  const rel = relationEntry(paths, pid);
  const relBits = [];
  if (rel.you) relBits.push('⭐ This is you');
  else {
    const auto = p.call ? rel.auto : rel;
    const lang = state.settings.lang;
    if (auto && auto.en && lang !== 'hi') relBits.push(esc(auto.en));
    if (auto && auto.hi && auto.hi !== auto.en && lang !== 'en') relBits.push(esc(auto.hi));
    if (!relBits.length && auto && (auto.en || auto.hi)) relBits.push(esc(auto.en || auto.hi));
  }
  const facts = [];

  if (p.by) facts.push(`Born ${esc(p.by)}`);
  if (p.dy) facts.push(`Passed away ${esc(p.dy)}`);
  const degAll = computeDegrees();
  const degBase = computeDegrees(true);
  const genAll = computeGenerations();
  if (degAll[pid] != null){
    const gc = genChip(genAll[pid]);
    const adjNote = degAll[pid] !== degBase[pid] ? ` (adjusted, was ${degBase[pid]})` : '';
    facts.push(`<span style="color:var(--muted)">Closeness degree ${degAll[pid]}${adjNote}${gc ? ' · ' + gc + ' gen' : ''}</span>`);
  }
  const spouses = spousesOf(pid), parents = parentsOf(pid), kids = childrenOfAll(pid), sibs = siblingsOf(pid);
  const rows = [['Spouse', spouses], ['Parents', parents], ['Children', kids], ['Siblings', sibs]]
    .filter(([, l]) => l.length)

  const chain = relChain(pid);
  const hasParents = !!parentUnionOf(pid);
  const kidUnions = unionsOf(pid).filter(uid => U()[uid].c.length);
  const anyOpen = kidUnions.some(uid => !state.collapsed.includes(uid));
  const branchBtn = kidUnions.length
    ? `<button data-act="branch" class="span2">${anyOpen ? '🙈 Fold family below' : '👁 Show family below'}</button>` : '';
  const focusable = focusUnionOf(pid) || parentUnionOf(pid);
  const avatarStyle = p.photo
    ? `background-image:url('${p.photo}')`
    : `background:color-mix(in srgb, ${sc} 16%, transparent); color:${sc}`;
  panel.innerHTML = `
    <div id="sheetGrab"></div>
    <button class="pclose" title="Close">✕</button>
    <div class="ph">
      <div class="avatar" style="${avatarStyle};border-color:${sc}">${p.photo ? '' : esc(initialsOf(p))}</div>
      <div>
        <div class="pname">${p.name ? esc(displayName(p)) : '<i style="color:var(--muted)">No name yet</i>'}</div>
        <div class="prel">${relBits.join('<br>') || '<i>Not connected to you yet</i>'}</div>
      </div>
    </div>
    ${facts.length ? `<div class="pfacts">${facts.join(' · ')}</div>` : ''}
    ${p.notes ? `<div class="pnotes">${esc(p.notes)}</div>` : ''}
    ${rows}
    ${chain.length > 1 ? `<div class="ppath">🧭 ${chain.map(c => esc(nm(c))).join(' → ')}</div>` : ''}
    <div class="pmain">
      <button data-act="path" ${chain.length > 1 ? '' : 'disabled'}>🧭 Show relationship path</button>
      <button data-act="focus" ${focusable ? '' : 'disabled'}>⤢ Focus</button>
      <button data-act="edit" class="primary">✏️ Edit</button>
    </div>

        ${branchBtn}
        ${pid !== state.meId ? `<button data-act="setme">⭐ Set as “Me”</button>` : '<span></span>'}
        <button data-act="delete" class="danger">🗑 Remove</button>

  panel.querySelector('.pclose').onclick = () => { selectedId = null; render(); };
  panel.querySelectorAll('[data-act]').forEach(b => b.onclick = () => panelAction(b.dataset.act, pid));
  panel.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
    selectedId = b.dataset.goto; renderPanel();

function panelAction(act, pid){
  const p = P()[pid];
  const who = displayName(p) || 'this person';
  if (act === 'spouse') openPersonModal(`Add ${who}’s spouse`, { g: p.g === 'm' ? 'f' : p.g === 'f' ? 'm' : '' }, true, vals => {
    const nid = addSpouse(pid, vals, vals._status);
    selectedId = nid; render();
  });
  else if (act === 'child'){
    const us = unionsOf(pid);
    const partnerChoice = us.length > 1 ? us : null;
    openPersonModal(`Add ${who}’s child`, {}, false, vals => {
      const nid = addChild(pid, vals, vals._union || undefined);
      selectedId = nid; render();
    }, partnerChoice, pid);
  }
  else if (act === 'sibling') openPersonModal(`Add ${who}’s sibling`, { g: '' }, false, vals => {
    const nid = addSibling(pid, vals);
    selectedId = nid; render();
  });
  else if (act === 'parents'){ addParents(pid); toast('Parents added — tap their cards to name them'); }
  else if (act === 'branch'){
    const kidUnions = unionsOf(pid).filter(uid => U()[uid].c.length);
    if (!kidUnions.length) return;
    const anyOpen = kidUnions.some(uid => !state.collapsed.includes(uid));
    snapshot();
    if (anyOpen){
      for (const uid of kidUnions) if (!state.collapsed.includes(uid)) state.collapsed.push(uid);
    } else {
      state.collapsed = state.collapsed.filter(uid => !kidUnions.includes(uid));
    }
    commit();
    toast(anyOpen ? 'Family below folded away' : 'Family below is back');
  }
  else if (act === 'path') showRelPath(pid);
  else if (act === 'focus'){
    if (currentView() === 'columns'){ locatePerson(pid); return; }
    const uid = focusUnionOf(pid) || parentUnionOf(pid);
    if (window.innerWidth <= 600) selectedId = null;
    setFocus(uid);
  }
  else if (act === 'left') moveSibling(pid, -1);
  else if (act === 'right') moveSibling(pid, +1);
  else if (act === 'edit') openEditModal(pid);
  else if (act === 'setme'){ snapshot(); state.meId = pid; commit(); toast('Relationships now shown relative to ' + who); }
  else if (act === 'delete') openDeleteModal(pid);
}

const ptrs = new Map();
let panBase = null, pinchBase = null, movedFar = false, downCard = null, downClps = null, downFocus = null;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  movedFar = false;
  const tg = e.target.closest ? e.target : null;
  downFocus = tg ? (tg.closest('.fbtn')?.dataset.uid ?? null) : null;
  downCard = tg ? (tg.closest('.card')?.dataset.pid ?? null) : null;
  downClps = tg ? (tg.closest('.clps')?.dataset.uid ?? null) : null;
  if (ptrs.size === 1) panBase = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
  if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    pinchBase = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k,
                  cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, vx: view.x, vy: view.y };
    panBase = null; movedFar = true;
  }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinchBase){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const nk = Math.min(2.5, Math.max(0.08, pinchBase.k * d / pinchBase.d));
    const r = svg.getBoundingClientRect();
    const cx = pinchBase.cx - r.left, cy = pinchBase.cy - r.top;
    view.x = cx - (cx - pinchBase.vx) * (nk / pinchBase.k);
    view.y = cy - (cy - pinchBase.vy) * (nk / pinchBase.k);
    view.k = nk;
    applyView(); movedFar = true;
    return;
  }
  if (panBase){
    const dx = e.clientX - panBase.sx, dy = e.clientY - panBase.sy;
    if (!movedFar && Math.hypot(dx, dy) > 6){ movedFar = true; svg.classList.add('panning'); }
    if (movedFar){ view.x = panBase.vx + dx; view.y = panBase.vy + dy; applyView(); }
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchBase = null;
  if (ptrs.size === 0){
    svg.classList.remove('panning');
    if (!movedFar && e.type === 'pointerup'){
      if (downFocus){ setFocus(downFocus); }
      else if (downClps){ toggleCollapse(downClps); }
      else if (downCard){ selectedId = downCard; render(); }
      else if (selectedId != null){ selectedId = null; render(); }
    }
    panBase = null; downCard = null; downClps = null; downFocus = null;
  }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.004));
  else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
}, { passive: false });
// Outline: native scrolling; Ctrl/⌘+wheel resizes
document.getElementById('outlineView').addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  setOutlineZoom(outlineZoom * Math.exp(-e.deltaY * 0.004));
}, { passive: false });

/* ================= search ================= */
const searchBox = document.getElementById('searchBox');
const searchResults = document.getElementById('searchResults');
let searchHits = [], searchIdx = 0;
function runSearch(){
  const q = searchBox.value.trim().toLowerCase();
  if (q.length < 2){ searchResults.style.display = 'none'; searchHits = []; return; }
  if (!RC) RC = { sides: computeSides(), paths: allPathsFromMe() };
  const scored = [];
  for (const [pid, p] of Object.entries(P())){
    const name = displayName(p), call = p.call || '';
    const re = relationEntry(RC.paths, pid);
    const rels = [relLabel(re), re.en, re.hi, re.auto && re.auto.en, re.auto && re.auto.hi].filter(Boolean).join(' | ');
    const n = name.toLowerCase(), c = call.toLowerCase(), r = rels.toLowerCase();
    let s = -1;
    if (n.startsWith(q) || n.split(/\s+/).some(w => w.startsWith(q))) s = 0;
    else if (n.includes(q)) s = 1;
    else if (c.includes(q)) s = 2;
    else if (r.includes(q)) s = 3;
    if (s >= 0) scored.push({ pid, s, name: name || '—', rel: relLabel(re), call });
  }
  scored.sort((a, b) => a.s - b.s || a.name.localeCompare(b.name));
  searchHits = scored.slice(0, 12); searchIdx = 0;
  if (!searchHits.length){
    searchResults.innerHTML = `<div class="sr" style="cursor:default;color:var(--muted)">No one matches “${esc(q)}”</div>`;
    searchResults.style.display = 'block'; return;
  }
  searchResults.innerHTML = searchHits.map((h, i) =>
    `<div class="sr${i === searchIdx ? ' act' : ''}" data-pid="${h.pid}"><span>${esc(h.name)}${h.call ? ` <i style="color:var(--muted)">“${esc(h.call)}”</i>` : ''}</span><small>${esc(h.rel)}</small></div>`).join('');
  searchResults.style.display = 'block';
  searchResults.querySelectorAll('.sr[data-pid]').forEach(el => el.onpointerdown = ev => { ev.preventDefault(); chooseSearch(el.dataset.pid); });
}
function chooseSearch(pid){
  searchResults.style.display = 'none';
  searchBox.value = ''; searchHits = [];
  searchBox.blur();
  locatePerson(pid);
}
searchBox.addEventListener('input', runSearch);
searchBox.addEventListener('keydown', e => {
  if (!searchHits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    searchIdx = (searchIdx + (e.key === 'ArrowDown' ? 1 : -1) + searchHits.length) % searchHits.length;
    searchResults.querySelectorAll('.sr').forEach((el, i) => el.classList.toggle('act', i === searchIdx));
  } else if (e.key === 'Enter'){ e.preventDefault(); chooseSearch(searchHits[searchIdx].pid); }
});
searchBox.addEventListener('focus', runSearch);
searchBox.addEventListener('blur', () => setTimeout(() => searchResults.style.display = 'none', 150));

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  const mode = currentView();
  if (e.key === '/' && !e.ctrlKey && !e.metaKey){ e.preventDefault(); searchBox.focus(); searchBox.select(); return; }
  if (e.key === 'Escape'){
    if (modalBg.style.display === 'flex') closeModal();
    else if (selectedId){ selectedId = null; render(); }
    return;
  }
  if (modalBg.style.display === 'flex') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))){ e.preventDefault(); redo(); return; }
  if (mode === 'columns' && columnsKey(e)) return;
  if (mode === 'tree'){
    if (e.key === '+' || e.key === '='){ const r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); }
    else if (e.key === '-'){ const r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); }
    else if (e.key.toLowerCase() === 'f'){ fitView(); }
  } else if (mode === 'outline'){
    if (e.key === '+' || e.key === '=') setOutlineZoom(outlineZoom * 1.25);
    else if (e.key === '-') setOutlineZoom(outlineZoom * 0.8);
  }
});
/* ================= save / load / png ================= */
function download(filename, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
// on phones, hand the file to the share sheet (WhatsApp etc.); on desktop, download
async function shareOrDownload(filename, blob, mime){
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (isMobile && navigator.canShare){
    try {
      const f = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [f] })){
        await navigator.share({ files: [f], title: filename });
        return 'shared';
      }
    } catch (e){ if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  download(filename, blob);
  return 'downloaded';
}
function slug(){ return (state.title || 'family-tree').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'family-tree'; }
async function exportJSON(){
  const data = JSON.stringify(Object.assign({}, state, { savedAt: new Date().toISOString() }), null, 1);
  if (IS_IOS){
    // iPhone/iPad: downloads don't work in the WhatsApp/Files preview.
    // Try the native share sheet (works in Safari); otherwise copy-as-text.
    try {
      const f = new File([data], slug() + '.json', { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })){
        await navigator.share({ files: [f], title: slug() + '.json' });
        dirty = false; syncToolbar();
        toast('Save file ready — WhatsApp it back so the tree stays in sync 💌');
        return;
      }
    } catch (e){ if (e && e.name === 'AbortError'){ toast('Share cancelled — changes still unsaved'); return; } }
    openCopySaveModal(data);
    return;
  }
  const how = await shareOrDownload(slug() + '.json', new Blob([data], { type: 'application/json' }), 'application/json');
  if (how === 'cancelled'){ toast('Share cancelled — your changes are still unsaved'); return; }
  dirty = false; syncToolbar();
  toast(how === 'shared'
    ? 'Save file ready — WhatsApp it back so the tree stays in sync 💌'
    : 'Saved! Keep this .json file — Import it next time to continue.');
}
function normalizeData(data){
  // fill any missing fields defensively; drop form-only junk
  for (const p of Object.values(data.people)){
    for (const k of ['name','g','by','dy','call','notes','photo','adj']) if (p[k] == null) p[k] = '';
    for (const k of Object.keys(p)) if (k.startsWith('_')) delete p[k];
  }
  for (const u of Object.values(data.unions)){ u.p = u.p || []; u.c = u.c || []; u.t = u.t || 'm'; }
  data.settings = Object.assign({ lang: 'en', theme: 'auto', view: '', orient: 'h', density: 'full' }, data.settings);
  data.seq = data.seq || 1000;
  data.title = data.title || 'Family Tree';
  if (!Array.isArray(data.collapsed)) data.collapsed = [];
  return data;
}
function importJSONText(txt){
  let data;
  try { data = JSON.parse(txt); } catch (e){ toast('That file isn’t valid JSON'); return; }
  if (!data || typeof data.people !== 'object' || typeof data.unions !== 'object'){ toast('That doesn’t look like a family-tree save file'); return; }
  snapshot();
  state = normalizeData(data);
  selectedId = null; firstRender = true;
  rebuildIndex(); render();
  dirty = false; syncToolbar();
  toast('Tree loaded ✓');
}

};
/* ---- PNG export ---- */
document.getElementById('btnPng').onclick = () => {
  if (currentView() !== 'tree' || !lastLayout) renderTree(true);
  if (!lastLayout) return;
  const t = T();
  const b = lastLayout.bbox;
  const pad = 30, headH = 56;
  const w = Math.ceil(b.w + pad * 2), h = Math.ceil(b.h + pad * 2 + headH);
  const vpClone = svg.querySelector('#vp').cloneNode(true);
  const tg = vpClone.querySelector('#toggles'); if (tg) tg.remove();   // no − dots on the image
  const inner = vpClone.innerHTML;
  const stamp = new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
  const hiddenNote = lastShown.shown < lastShown.total
    ? `<text x="${pad}" y="${pad + 26}" font-size="11" fill="${t.muted}">showing ${lastShown.shown} of ${lastShown.total} — some branches are collapsed (+N) or filtered</text>` : '';
  const doc = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect width="${w}" height="${h}" fill="${t.page}"/>
    <text x="${pad}" y="${pad + 8}" font-size="20" font-weight="700" fill="${t.ink}">${esc(state.title)}</text>
    <text x="${w - pad}" y="${pad + 8}" font-size="11" fill="${t.muted}" text-anchor="end">${stamp}</text>
    ${hiddenNote}
    <g transform="translate(${pad - b.x}, ${pad + headH - b.y})">${inner}</g>
  </svg>`;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([doc], { type: 'image/svg+xml;charset=utf-8' }));
  img.onload = () => {
    const scale = Math.min(2, 8000 / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    cv.toBlob(async bl => {
      if (!bl) return;
      if (IS_IOS){
        try {
          const f = new File([bl], slug() + '.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [f] })){
            await navigator.share({ files: [f], title: slug() + '.png' });
            toast('Tree image ready to share 💌');
            return;
          }
        } catch (e){ if (e && e.name === 'AbortError') return; }
        openImageModal(cv.toDataURL('image/png'));   // long-press to save/copy
        return;
      }
      const how = await shareOrDownload(slug() + '.png', bl, 'image/png');
      if (how !== 'cancelled') toast(how === 'shared' ? 'Tree image ready to share 💌' : 'PNG downloaded — perfect for WhatsApp 😉');
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('PNG export failed — try again'); };
  img.src = url;
};
